<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הכספים שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font-anthropic-sans:Heebo,system-ui,sans-serif;--font-anthropic-serif:Heebo,system-ui,sans-serif;
  --color-fg:#0B3B2E;--color-fg-muted:#5E8A7C;--color-panel:#FFFFFF;--color-border-line:#D3EEE4;
  --color-bg:#F0FAF6;--color-ok:#10A37F;--color-bad:#E8435F;
  --cds-gap-sm:8px;--cds-gap-md:12px;--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-md:16px;--cds-radius:14px;
  --cds-font-size-title:30px;--cds-font-size-heading:22px;--cds-font-size-body:14px;--cds-font-size-caption:12px;
  --cds-chart-axis:rgba(11,59,46,.2);--cds-chart-muted:#CFE6DE;--cds-chart-status-critical:#E8435F;--cds-chart-reference:#C08A00;
  --cds-surface-popover:#FFFFFF;--cds-border:#D3EEE4;--cds-shadow-popover:0 8px 24px rgba(11,59,46,.15);--cds-text-secondary:#5E8A7C;--cds-dur-slow:.3s
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Heebo,system-ui,sans-serif;color:var(--color-fg);min-height:100vh;
  background:linear-gradient(180deg,#EFFBF6 0%,#ECF9F5 50%,#EAF6FB 100%);background-attachment:fixed}
#dash-root{padding:0 14px calc(var(--nav-h,0px) + 24px)}
#boot{color:var(--color-fg-muted);text-align:center;padding:calc(var(--top-h,0px) + 60px) 20px}
.km-head{margin:0 -14px 4px;text-align:center;padding:calc(var(--top-h,0px) + 22px) 16px 22px!important;
  background:linear-gradient(155deg,#065F46 0%,#059669 55%,#5EEAD4 130%);border-radius:0 0 28px 28px}
.km-title{font-weight:800!important;font-size:28px!important;color:#fff}
.km-head .dt{font-size:13px;color:rgba(255,255,255,.8);margin-top:4px}
.km-big,.km-total{font-weight:800!important}
.km-card{box-shadow:0 6px 22px rgba(5,150,105,.08)}
.km-sub{display:none}
.km-seg button.on{background:#fff!important;color:#047857!important;box-shadow:0 0 0 1px #9FE3CB!important}
.km-bar i{box-shadow:none!important}
.km-cash-month { text-align: left; }
.km-range { display: block; font-size: 11px; color: var(--color-fg-muted); margin-top: 2px; }
.km-cash-month b { display: block; font-weight: 600; font-size: var(--cds-font-size-heading); margin-top: 2px; }
.km-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.km-chips span { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--color-bg); color: var(--color-fg-muted); }
.km-chips span b { font-weight: 600; color: var(--color-fg); margin-inline-start: 4px; }
.km-cash-tabs { margin-top: 12px; }
.km-cash-add { grid-template-columns: 1fr 1.1fr 1.2fr auto; }
.km-cash-hint { align-self: center; font-size: 12px; color: var(--color-fg-muted); }
#cash .km-led { grid-template-columns: 3rem 1fr auto !important; cursor: pointer; }
#cash .km-led.on { background: color-mix(in srgb, var(--color-ok) 7%, transparent); border-radius: 10px; }
.km-act { display: flex; gap: 8px; justify-content: flex-end; padding: 2px 0 8px; }
.km-act button { border: 0; border-radius: 999px; padding: 5px 14px; font: inherit; font-size: 13px; font-weight: 600; background: var(--color-bg); color: var(--color-fg); }
.km-act button.del { color: var(--km-red); background: color-mix(in srgb, var(--km-red) 10%, transparent); }
#year.km-yr-card { background: linear-gradient(180deg, #EAF3FC, #F8FBFE 75%) !important; box-shadow: 0 6px 22px rgba(47,128,201,.10); }
.km-yr-card .km-whatif { margin-top: 10px; }
#cash .km-led .d { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); align-self: center; }
.km-add[hidden] { display: none; }
.km-jlink { margin-top: 12px; border: 0; background: rgba(255,255,255,.2); color: #fff; border-radius: 99px; padding: 7px 16px; font: inherit; font-size: 14px; font-weight: 600; }
</style>
<link rel="stylesheet" href="apple.css?v=1">
</head>
<body data-tab="finance">
<div id="boot">טוען…</div>
<div id="dash-root" hidden>
<div class="km" dir="rtl">
  <header class="km-head">
    <h1 class="km-title">הכספים שלי</h1>
    <div class="dt" data-today></div>
    <button type="button" class="km-jlink" onclick="Roy.go('journal')">יומן הוצאות וניתוח</button>
  </header>

  <section class="km-card km-room" id="room" hidden></section>

  <section class="km-card" id="bank">
    <div class="km-label" id="bank-label">בנק עכשיו</div>
    <div class="km-big" id="bank-now">—</div>
    <div class="km-ledger" id="ledger-list"></div>
    <button type="button" class="km-more" id="led-more" hidden>עוד</button>
    <details class="km-what" id="exp-box">
      <summary id="exp-sum">צפוי</summary>
      <div class="km-ledger" id="expected-list"></div>
      <div class="km-add">
        <input id="add-name" type="text" placeholder="מה" aria-label="תיאור">
        <input id="add-amt" type="text" inputmode="numeric" placeholder="סכום" aria-label="סכום">
        <select id="add-sign" aria-label="סוג"><option value="-">הוצאה</option><option value="+">הכנסה</option></select>
        <button type="button" id="add-btn">הוסף</button>
      </div>
    </details>
    <div class="km-on15" id="on15"><span>ב15 לחודש</span><b id="on15-v">—</b></div>
  </section>

  <section class="km-card km-yr-card" id="year">
    <div class="km-yr" id="yr"></div>
    <div class="km-whatif" id="whatif">
      <label class="km-field"><span>הוספה לחשבון</span><span class="km-inp"><input id="w-transfer" type="text" inputmode="numeric" placeholder="0" aria-label="הוספה לחשבון"><i>₪</i></span></label>
      <label class="km-field"><span>הוצאה חריגה</span><span class="km-inp"><input id="w-vacation" type="text" inputmode="numeric" placeholder="0" aria-label="הוצאה חריגה"><i>₪</i></span></label>
      <label class="km-field"><span>בחודש</span><span class="km-inp"><select id="w-month" aria-label="באיזה חודש ההוצאה החריגה יורדת"></select></span></label>
    </div>
  </section>

  <section class="km-card" id="cash">
    <div class="km-row">
      <div>
        <div class="km-label">מזומן ביד</div>
        <div class="km-big" id="cash-now">—</div>
      </div>
      <div class="km-cash-month"><span class="km-label" id="cash-month-label">יצא החודש</span><b id="cash-month">—</b><small id="cash-range" class="km-range"></small></div>
    </div>
    <div class="km-ledger" id="cash-list"></div>
    <button type="button" class="km-more" id="cash-more" hidden>עוד</button>
    <div class="km-cash-tabs km-seg" role="tablist">
      <button type="button" data-m="out" class="on">הוצאתי</button>
      <button type="button" data-m="in">משכתי</button>
    </div>
    <div class="km-add km-cash-add" id="cash-out">
      <input id="cash-amt" type="text" inputmode="decimal" placeholder="סכום" aria-label="סכום">
      <select id="cash-cat" aria-label="על מה"><option>אוכל</option><option>תספורת</option><option>אימון</option><option>בילויים</option><option>המרה לחו״ל</option><option>אחר</option></select>
      <input id="cash-note" type="text" placeholder="הערה" aria-label="הערה">
      <button type="button" id="cash-out-btn">הוסף</button>
    </div>
    <div class="km-add km-cash-add" id="cash-in" hidden>
      <input id="cash-in-amt" type="text" inputmode="decimal" placeholder="סכום" aria-label="סכום שנמשך">
      <input id="cash-fee" type="text" inputmode="decimal" placeholder="עמלה" aria-label="עמלה">
      <span class="km-cash-hint">יורד גם מהבנק</span>
      <button type="button" id="cash-in-btn">הוסף</button>
    </div>
  </section>

  <section class="km-card" id="goals">
    <div class="km-label">יעדים</div>
    <div class="km-goals" id="goal-list"></div>
  </section>

  <section class="km-card" id="networth">
    <div class="km-label">שווי נקי</div>
    <div class="km-big" data-field="net">—</div>
    <div class="km-lines">
      <div class="km-line" id="row-bank"><span>עו״ש</span><span data-field="bank">—</span></div>
      <div class="km-line"><span>תיק</span><span data-field="portfolio">—</span></div>
      <div class="km-line"><span>פנסיה</span><span data-field="pension">—</span></div>
      <div class="km-line"><span>רכב</span><span data-field="car">—</span></div>
      <div class="km-line"><span>יתרת הלוואה</span><span data-field="loan">—</span></div>
    </div>
    <div class="km-hist-head"><span class="km-label">לאורך זמן</span><span class="km-rate" id="rate"></span></div>
    <div class="km-chart km-chart-sm" id="chart-hist"></div>
  </section>

  <section class="km-card" id="expenses">
    <div class="km-row">
      <div class="km-label">הוצאות קבועות בחודש</div>
      <div class="km-total" id="total">—</div>
    </div>
    <div class="km-list" id="exp-list"></div>
  </section>

  <section class="km-card" id="subs">
    <div class="km-row">
      <div>
        <div class="km-label">מנויים</div>
        <div class="km-total" id="subs-month">—</div>
      </div>
      <div class="km-cash-month"><span class="km-label">בשנה</span><b id="subs-year">—</b></div>
    </div>
    <div class="km-list" id="subs-list"></div>
  </section>

  <section class="km-card an" id="analysis" hidden></section>
</div>

<style>
.km { max-width: 640px; margin-inline: auto; font-family: var(--font-anthropic-sans); color: var(--color-fg); display: flex; flex-direction: column; gap: var(--cds-gap-md); font-variant-numeric: tabular-nums; }
.km-head { padding: var(--cds-pad-sm) 2px 0; }
@media (min-width: 1000px) { .km { max-width: 1400px; display: grid; grid-template-columns: 1fr 1fr; align-items: start; padding: 0 20px 12px; } .km-head { grid-column: 1 / -1; } }
.km-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); margin: 0; }
.km-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md); min-width: 0; overflow: hidden; }
.km-row { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--cds-gap-md); }
.km-label { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.km-big { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); line-height: 1.2; margin-top: 2px; }
.km { --km-red: #ff4d63; }
.km-neg { color: var(--km-red); font-weight: 500; }
.km-line.km-alert { border: 1.5px solid var(--km-red); border-radius: var(--cds-radius); padding: 6px 10px; margin: 4px 0 6px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--km-red) 15%, transparent); }
.km-line.km-alert + .km-line { border-top: 0; }
.km-line.km-alert span:first-child { color: var(--km-red); }
.km-ok { color: var(--color-ok); }
.km-chart { position: relative; margin-top: var(--cds-gap-sm); min-height: 180px; }
.km-chart svg { display: block; }
.km-whatif { display: grid; grid-template-columns: 1fr 1fr; gap: var(--cds-gap-sm); margin-top: var(--cds-gap-md); }
.km-field { min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.km-inp { display: flex; align-items: center; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); padding: 0 10px; }
.km-inp input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--color-fg); font: inherit; font-size: 16px; padding: 9px 0; outline: none; direction: ltr; text-align: right; }
.km-inp i { font-style: normal; color: var(--color-fg-muted); margin-inline-start: 6px; }
.km-lines { margin-top: var(--cds-gap-sm); }
.km-line { display: flex; justify-content: space-between; font-size: var(--cds-font-size-body); padding: 5px 0; border-top: 1px solid var(--color-border-line); }
.km-line span:first-child { color: var(--color-fg-muted); }
.km-legend { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); display: flex; align-items: center; gap: 5px; }
.km-sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-inline-start: 6px; }
.km-sw-exp { background: var(--cds-chart-muted); }
.km-sw-free { background: var(--color-ok); }
.km-releases { margin-top: var(--cds-gap-sm); }
.km-rel { display: grid; grid-template-columns: 4.6rem 1fr auto; gap: 8px; font-size: var(--cds-font-size-caption); padding: 4px 0; border-top: 1px solid var(--color-border-line); }
.km-rel b { font-weight: 400; color: var(--color-fg-muted); }
.km-total { font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-heading); }
.km-list { margin-top: var(--cds-gap-sm); }
.km-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--color-border-line); font-size: var(--cds-font-size-body); }
.km-item .n { flex: 1; }
.km-item .a { white-space: nowrap; }
.km-item .a small { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.km-pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--color-bg); color: var(--color-fg-muted); border: 1px solid var(--color-border-line); white-space: nowrap; }
.km-pill.last { color: var(--cds-chart-reference); border-color: currentColor; }
.km-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; direction: rtl; display: none; z-index: 2; }
.km-tip .d { color: var(--cds-text-secondary); }
.km-seg { display: inline-flex; border: 1px solid var(--color-border-line); border-radius: 999px; padding: 2px; background: var(--color-bg); }
.km-seg button { font: inherit; font-size: var(--cds-font-size-caption); border: 0; background: transparent; color: var(--color-fg-muted); padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.km-seg button.on { background: rgba(52,211,153,.18); color: var(--color-fg); box-shadow: 0 0 0 1px rgba(52,211,153,.45); }
.km-sub { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-top: var(--cds-gap-sm); }
.km-goal { padding: 8px 0; border-top: 1px solid var(--color-border-line); }
.km-goal:first-child { border-top: 0; }
.km-goal-top { display: flex; justify-content: space-between; gap: 8px; font-size: var(--cds-font-size-body); }
.km-goal-top b { font-weight: 400; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); align-self: flex-end; }
.km-goal-sub { display: flex; justify-content: space-between; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-top: 3px; }
.km-bar { height: 8px; border-radius: 4px; background: var(--color-border-line); margin-top: 6px; overflow: hidden; }
.km-bar i { display: block; height: 100%; min-width: 0; background: var(--color-ok); border-radius: 4px; box-shadow: 0 0 10px rgba(52,211,153,.45); }
.km-hist-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: var(--cds-gap-md); }
.km-rate { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.km-chart-sm { min-height: 150px; margin-top: 4px; }
.km-low { text-align: start; min-width: 9.5rem; }
.km-neg-fill { fill: var(--color-bad); }
#year .km-whatif { grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
#year .km-inp { border-color: transparent; background: color-mix(in srgb, var(--color-fg) 5%, transparent); }
#year .km-inp { height: 44px !important; min-height: 44px; box-sizing: border-box; }
.km-led .a.km-neg { color: var(--km-red); }
.km-led .a.km-ok { color: var(--color-ok); }
#year .km-inp input, .km-inp select { font-size: 16px; padding: 7px 0; }
.km-inp select { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--color-fg); font: inherit; outline: none; -webkit-appearance: none; appearance: none; }
.km-tablebox { margin-top: 14px; }
.km-tbl { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-body); }
.km-tbl th, .km-tbl td { padding: 9px 4px; text-align: center; white-space: nowrap; }
.km-tbl tbody tr + tr th, .km-tbl tbody tr + tr td { border-top: .5px solid var(--color-border-line); }
.km-tbl thead th { font-weight: 400; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); padding-bottom: 4px; }
.km-tbl tbody th { font-weight: 400; color: var(--color-fg-muted); text-align: right; width: 30%; }
.km-tbl td.km-end span { font-weight: 600; }
.km-tbl tr.km-x th { color: var(--color-fg); }
.km-tbl .km-neg { font-weight: 400; }
.km-pos { color: var(--color-fg); }
.km-crit { color: var(--km-red); background: color-mix(in srgb, var(--km-red) 12%, transparent); border-radius: 999px; padding: 2px 8px; }
.km-more { display: block; margin: 6px auto 0; font: inherit; font-size: 13px; font-weight: 500; color: var(--color-ok); background: none; border: 0; padding: 4px 10px; cursor: pointer; }
.km-what { margin-top: 6px; border-top: .5px solid var(--color-border-line); padding-top: 6px; }
.km-what summary { cursor: pointer; font-size: 13px; color: var(--color-fg-muted); list-style: none; padding: 4px 0; }
.km-what summary::-webkit-details-marker { display: none; }
.km-what summary::after { content: ' \203a'; }
.km-what[open] summary::after { content: ' ⌄'; }
.km-oneoffs .km-rel { border-top: 0; }
.km-more[hidden] { display: none; }
.km-ledger { margin-top: 12px; }
.km-led { display: grid; grid-template-columns: 1fr auto 5.5rem; gap: 10px; padding: 7px 0; font-size: var(--cds-font-size-body); border-top: .5px solid var(--color-border-line); }
.km-led.km-first { border-top: 0; color: var(--color-fg-muted); }
.km-led .a { white-space: nowrap; color: var(--color-fg-muted); }
.km-led .b { white-space: nowrap; text-align: left; font-weight: 500; }
.km-led.km-exp { color: var(--color-fg-muted); }
.km-led.km-exp .b { font-weight: 400; }
.km-led.km-exp .n::after { content: ' · צפוי'; font-size: var(--cds-font-size-caption); }
.km-on15 { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--color-ok) 8%, transparent); font-size: var(--cds-font-size-body); font-weight: 500; }
.km-on15 b { font-weight: 700; font-size: 20px; }
.km-on15.km-on15-neg { background: color-mix(in srgb, var(--km-red) 8%, transparent); }
.km-led { grid-template-columns: 1fr auto 5.5rem auto !important; }
.km-x-btn { border: 0; background: none; color: var(--color-fg-muted); font-size: 18px; line-height: 1; padding: 0 2px; cursor: pointer; }
.km-add { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 6px; margin-top: 8px; }
.km-add input, .km-add select { min-width: 0; border: 0; border-radius: 10px; background: var(--color-bg); color: var(--color-fg); font: inherit; font-size: 16px; padding: 8px 10px; outline: none; -webkit-appearance: none; appearance: none; }
.km-add button { border: 0; border-radius: 10px; background: var(--color-ok); color: #fff; font: inherit; font-size: 14px; font-weight: 700; padding: 8px 12px; cursor: pointer; }
.km-yr { position: relative; margin-top: 8px; }
.km-low { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin: 2px 0 4px; }
.km-low b { color: var(--color-fg); font-weight: 600; }
.km-low.km-neg b, .km-low.km-neg { color: var(--km-red); }
.km-fhead { margin-top: 18px; align-items: center; }

/* Analysis block: wide screens only */
#analysis { display: none !important; }
@media (min-width: 1024px) {
  #analysis:not([hidden]) { display: block !important; grid-column: 1 / -1; padding: 22px 24px; }
}
.an-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.an-head span { font-size: 20px; font-weight: 800; }
.an-head small { font-size: 13px; color: var(--color-fg-muted); }
