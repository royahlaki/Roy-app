<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="דף הבית">
<meta name="theme-color" content="#0b0f1e">
<title>דף הבית</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/app3-180.png">
<link rel="icon" type="image/png" href="icons/app3-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:var(--app-h,100%);background:#0b0f1e;color:#EEF2FF;font-family:Heebo,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#probe{position:fixed;visibility:hidden;pointer-events:none;top:0;left:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#frames{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%)}
#frames iframe{position:absolute;inset:0;width:1px;min-width:100%;max-width:100%;height:100%;border:0;display:block;background:transparent;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .28s}
#frames iframe.on{opacity:1;visibility:visible;transition:opacity .28s ease,visibility 0s}
nav{position:fixed;left:10px;right:10px;--gap:max(6px,calc(env(safe-area-inset-bottom) - 12px));top:calc(var(--app-h,100vh) - 52px - var(--gap));height:52px;
  display:flex;border-radius:22px;z-index:3;overflow:hidden;
  background:var(--nav-bg);border:1px solid var(--nav-line);box-shadow:0 8px 28px rgba(0,0,0,.18);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  transition:background-color .35s ease,border-color .35s ease}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--nav-fg);font:inherit;font-size:10px;white-space:nowrap;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:color .35s ease}
nav button svg{width:21px;height:21px}
nav button[aria-current=page]{color:var(--nav-on)}
body{--nav-bg:rgba(255,255,255,.62);--nav-line:rgba(15,23,42,.08);--nav-fg:#64748B;--nav-on:#2563EB;transition:background-color .35s ease}
body.t-home{background:#070A16;--nav-bg:rgba(22,27,52,.62);--nav-line:rgba(255,255,255,.10);--nav-fg:#8A93B5;--nav-on:#4ADE80}
body.t-portfolio{background:#F6F8FD;--nav-bg:rgba(255,255,255,.72);--nav-line:rgba(15,23,42,.08);--nav-fg:#64748B;--nav-on:#6366F1}
body.t-entry{background:#0a0e1a;--nav-bg:rgba(16,24,44,.55);--nav-line:rgba(255,255,255,.1);--nav-fg:#93a0c2;--nav-on:#ffd166}
body.t-lab{background:#0d0a1c;--nav-bg:rgba(24,16,52,.5);--nav-line:rgba(255,255,255,.1);--nav-fg:#9a92c4;--nav-on:#C9A8FF}
body.t-sectors{background:#0b0f0c;--nav-bg:rgba(20,34,16,.5);--nav-line:rgba(255,255,255,.1);--nav-fg:#93A198;--nav-on:#C3F53C}
body.t-sectors,body.t-map{background:#0b0f0c;--nav-bg:rgba(20,34,16,.5);--nav-line:rgba(255,255,255,.1);--nav-fg:#93A198;--nav-on:#C3F53C}
body.t-finance,body.t-journal{background:#EFFBF6;--nav-bg:rgba(232,250,243,.66);--nav-line:rgba(5,150,105,.16);--nav-fg:#5E8A7C;--nav-on:#059669}
body.t-finance,body.t-journal{background:#F6F9FC;--nav-bg:rgba(255,255,255,.72);--nav-line:rgba(15,30,61,.08);--nav-fg:#64748B;--nav-on:#0E9488}
/* Apple polish: softer glass tab bar */
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew",Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
nav{border-radius:26px;border-width:.5px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.12);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%)}
nav button{font-weight:500;letter-spacing:-.01em;transition:color .35s ease,transform .15s cubic-bezier(.2,.8,.2,1)}
nav button:active{transform:scale(.9)}
nav button[aria-current=page]{font-weight:600}
@media(prefers-color-scheme:dark){
}
#lock{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 600px at 80% -10%,#1d3b8a 0%,transparent 60%),radial-gradient(800px 500px at 0% 110%,#3b1d72 0%,transparent 60%),#0b0f1e}
#lock[hidden]{display:none}
#lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
#lock .ic{width:72px;height:72px;margin:0 auto 6px;border-radius:18px;display:block}
#lock h1{margin:0;font-size:24px;font-weight:800}
#lock p{margin:0;color:#A7B0D0;font-size:14px;line-height:1.5}
#lock input{font:inherit;font-size:17px;text-align:center;direction:ltr;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:#fff}
#lock button{font:inherit;font-size:17px;font-weight:700;padding:14px;border-radius:14px;border:0;background:linear-gradient(135deg,#39d98a,#22b3a6);color:#04170f;cursor:pointer}
#lock .err{color:#FF6B85;font-size:14px;min-height:1.4em}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8C97BA;font-size:14px;z-index:2}
/* Manual refresh: pull down at the top of a page, or long press a tab */
nav button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#ptr{position:fixed;left:50%;top:0;z-index:5;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:rgba(255,255,255,.92);
  box-shadow:0 4px 16px rgba(15,23,42,.18);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;
  transform:translateY(-50px);transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s}
#ptr svg{width:20px;height:20px;color:#4F46E5;transition:transform .1s linear}
#ptr.drag{transition:none}
#ptr.ready svg{color:#059669}
#ptr.spin{opacity:1}
#ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
  #live{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);z-index:50;font:600 12px -apple-system,system-ui,sans-serif;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.92);color:#8a5a00;box-shadow:0 2px 10px rgba(0,0,0,.12);direction:rtl;white-space:nowrap}
  #live.ok{color:#0a7a45}
</style>
</head>
<body>
<div id="probe"></div>
<div id="boot">טוען…</div>
<div id="live" hidden></div>
<div id="frames"></div>
<div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></div>

<nav id="nav" hidden>
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>בית</button>
  <button type="button" data-tab="portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>התיק שלי</button>
  <button type="button" data-tab="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7.5 15h9"/></svg>המעבדה</button>
  <button type="button" data-tab="sectors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>סקטורים</button>
  <button type="button" data-tab="finance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/><path d="M16 15h2.5"/></svg>כספים</button>
</nav>

<div id="lock" hidden>
  <form id="lockf" autocomplete="off">
    <img class="ic" src="icons/app3-192.png" alt="">
    <h1>דף הבית</h1>
    <p>הנתונים שלך מוצפנים. מקלידים את הסיסמה פעם אחת, והמכשיר זוכר אותה.</p>
    <input id="pass" type="password" placeholder="סיסמה" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="submit">פתח</button>
    <div class="err" id="err"></div>
  </form>
</div>

<script src="js/core.js?v=15"></script>
<script>
(function () {
  var TABS = ['home', 'portfolio', 'lab', 'sectors', 'finance', 'map', 'entry', 'journal'];
  var BOOT = Date.now().toString(36);
  var PAGES = { home: 'home.html', portfolio: 'portfolio.html', lab: 'lab.html', sectors: 'sectors.html', finance: 'finance.html', map: 'map.html', entry: 'entry.html', journal: 'journal.html' };
  var frames = {}, current = null, dataP = null, lpFired = false;
  var $ = function (id) { return document.getElementById(id); };

  window.roy = {
    data: function () { return dataP; },
    tabs: TABS,
    go: function (tab, hash) { show(tab, hash || ''); }
  };

  var NAV_H = 52;
  /* Only the iPhone home-screen app needs the screen-height workaround; on a Mac (Dock app or browser) the window height is right */
  var standalone = navigator.standalone === true && navigator.maxTouchPoints > 0;
  function sizeApp() {
    /* iOS home-screen apps can report a viewport shorter than the screen; use the real screen height there */
    var h = window.innerHeight;
    if (standalone && screen && screen.height) {
      var land = window.innerWidth > window.innerHeight;
      h = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    }
    document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  sizeApp();
  window.addEventListener('orientationchange', function () { setTimeout(function () { sizeApp(); insets(); }, 300); });
  function insets(f) {
    var cs = getComputedStyle($('probe')), top = parseFloat(cs.paddingTop) || 0, bot = parseFloat(cs.paddingBottom) || 0;
    var navBottom = Math.max(6, bot - 12), list = f ? [f] : TABS.map(function (t) { return frames[t]; }).filter(Boolean);
    list.forEach(function (fr) {
      try {
        var de = fr.contentDocument && fr.contentDocument.documentElement; if (!de) return;
        de.style.setProperty('--top-h', top + 'px');
        de.style.setProperty('--nav-h', (NAV_H + navBottom + 12) + 'px');
      } catch (e) {}
    });
  }
  window.addEventListener('resize', function () { sizeApp(); insets(); });
  /* Back after a long break (the iPhone keeps the app alive in the background): reload so data and pages are fresh */
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000) location.reload();
  });
  function frame(tab, hash) {
    var f = frames[tab];
    if (!f) { f = document.createElement('iframe'); f.title = tab; frames[tab] = f; f.addEventListener('load', function () { insets(f); pull(f); }); $('frames').appendChild(f); }
    if (!f.src || hash) f.src = PAGES[tab] + '?b=' + BOOT + (hash || '');
    return f;
  }
  function show(tab, hash) {
    if (TABS.indexOf(tab) === -1) tab = 'home';
    var f = frame(tab, hash);
    TABS.forEach(function (t) { if (frames[t]) frames[t].classList.toggle('on', t === tab); });
    document.querySelectorAll('nav button').forEach(function (b) {
      if (b.dataset.tab === (tab === 'map' ? 'sectors' : tab === 'entry' ? 'lab' : tab === 'journal' ? 'finance' : tab)) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    current = tab;
    document.body.className = 't-' + tab;
    insets(f);
    try { localStorage.setItem('roy-tab', tab); } catch (e) {}
    history.replaceState(null, '', '#' + tab);
  }
  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (lpFired) { lpFired = false; return; }
      if (b.dataset.tab === current) { try { frames[current].contentWindow.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {} return; }
      show(b.dataset.tab);
    });
  });

  /* ---------- manual refresh ---------- */
  var refreshing = false, ptr = $('ptr'), TOP = function () { return (parseFloat(getComputedStyle($('probe')).paddingTop) || 0) + 10; };
  function refresh() {
    if (refreshing) return; refreshing = true;
    ptr.classList.remove('drag'); ptr.classList.add('spin'); ptr.style.transform = 'translateY(' + TOP() + 'px)';
    var done = function () { location.reload(); };
    Promise.race([Roy._sync.flush ? Roy._sync.flush() : Promise.resolve(), new Promise(function (r) { setTimeout(r, 1500); })]).then(done, done);
  }
  window.roy.refresh = refresh;
  /* Pull down at the top of the page */
  var PULL = 70;
  function pull(f) {
    var w, d; try { w = f.contentWindow; d = f.contentDocument; } catch (e) { return; }
    if (!w || !d || w.__pull) return; w.__pull = true;
    var y0 = null, dy = 0;
    var atTop = function () { return (w.scrollY || (d.scrollingElement && d.scrollingElement.scrollTop) || 0) <= 0; };
    w.addEventListener('touchstart', function (e) {
      if (refreshing || e.touches.length !== 1 || !atTop()) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0;
    }, { passive: true });
    w.addEventListener('touchmove', function (e) {
      if (y0 === null || refreshing) return;
      dy = (e.touches[0].clientY - y0) * 0.5;
      if (dy <= 4 || !atTop()) { ptr.style.opacity = 0; ptr.style.transform = 'translateY(-50px)'; return; }
      var p = Math.min(dy, PULL + 20);
      ptr.classList.add('drag'); ptr.classList.toggle('ready', dy >= PULL);
      ptr.style.opacity = Math.min(1, dy / PULL);
      ptr.style.transform = 'translateY(' + (TOP() - 50 + p) + 'px)';
      ptr.querySelector('svg').style.transform = 'rotate(' + Math.round(dy / PULL * 300) + 'deg)';
    }, { passive: true });
    var end = function () {
      if (y0 === null || refreshing) return; y0 = null;
      ptr.classList.remove('drag', 'ready');
      if (dy >= PULL) { ptr.style.opacity = 1; refresh(); }
      else { ptr.style.opacity = 0; ptr.style.transform = 'translateY(-50px)'; }
      dy = 0;
    };
    w.addEventListener('touchend', end, { passive: true });
    w.addEventListener('touchcancel', end, { passive: true });
  }
  /* Long press on a tab in the bottom bar: refresh (and land on that tab) */
  var lpT = null;
  document.querySelectorAll('nav button').forEach(function (b) {
    var cancel = function () { clearTimeout(lpT); lpT = null; };
    b.addEventListener('pointerdown', function () {
      lpFired = false; cancel();
      lpT = setTimeout(function () {
        lpFired = true;
        if (b.dataset.tab !== current) show(b.dataset.tab);
        refresh();
      }, 550);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, cancel); });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  /* Live data: if Google did not answer in time, show what is saved, keep trying, and refresh the pages once it answers */
  var liveTries = 0;
  function liveTag(txt, ok) {
    var t = $('live'); if (!t) return;
    t.textContent = txt; t.className = ok ? 'ok' : ''; t.hidden = !txt;
    if (ok) setTimeout(function () { t.hidden = true; }, 2500);
  }
  function retryLive(data) {
    if (data._live || liveTries >= 6) { if (!data._live) liveTag('אין חיבור לנתונים החיים. משוך למטה לרענון', false); return; }
    liveTries++;
    setTimeout(function () {
      Roy.load().then(Roy._sync.sync).then(function (fresh) {
        if (!fresh._live) return retryLive(fresh);
        dataP = Promise.resolve(fresh);
        BOOT = Date.now().toString(36);
        TABS.forEach(function (t) { var f = frames[t]; if (f && f.src) f.src = PAGES[t] + '?b=' + BOOT; });
        liveTag('נתונים חיים ✓', true);
      }, function () { retryLive(data); });
    }, 4000);
  }
  function start(data) {
    dataP = Promise.resolve(data);
    if (data && data._live === false) { liveTag('מתחבר לנתונים חיים…', false); retryLive(data); }
    $('lock').hidden = true; $('boot').hidden = true; $('nav').hidden = false;
    var first = location.hash.slice(1);
    if (TABS.indexOf(first) === -1) { try { first = localStorage.getItem('roy-tab') || 'home'; } catch (e) { first = 'home'; } }
    show(first);
  }
  function askPass(msg) {
    $('boot').hidden = true; $('lock').hidden = false; $('err').textContent = msg || '';
  }
  $('lockf').addEventListener('submit', function (e) {
    e.preventDefault();
    var p = $('pass').value; if (!p.trim()) return;
    $('err').textContent = 'בודק…';
    Roy.unlock(p).then(Roy._sync.sync).then(start, function () { $('err').textContent = 'הסיסמה לא נכונה. נסה שוב.'; });
  });

  /* The home-screen app can stay in memory for hours: after a minute in the background, reload so the data is fresh */
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 60000 && dataP) location.reload();
  });

  if (!Roy.hasKey()) askPass();
  else Roy.load().then(Roy._sync.sync).then(start, function (e) {
    if (String(e && e.message).indexOf('bundle') === 0) { $('boot').textContent = 'אין חיבור לאינטרנט. נסה שוב בעוד רגע.'; return; }
    Roy.forget(); askPass('צריך להקליד את הסיסמה מחדש.');
  });
})();
</script>
</body>
</html>
