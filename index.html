<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="דף הבית">
<meta name="theme-color" content="#0b0f1e">
<title>דף הבית</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:var(--app-h,100%);background:#0b0f1e;color:#EEF2FF;font-family:Heebo,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#probe{position:fixed;visibility:hidden;pointer-events:none;top:0;left:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#frames{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%)}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .28s}
#frames iframe.on{opacity:1;visibility:visible;transition:opacity .28s ease,visibility 0s}
nav{position:fixed;left:10px;right:10px;--gap:max(6px,calc(env(safe-area-inset-bottom) - 12px));top:calc(var(--app-h,100vh) - 52px - var(--gap));height:52px;
  display:flex;border-radius:22px;z-index:3;overflow:hidden;
  background:var(--nav-bg);border:1px solid var(--nav-line);box-shadow:0 8px 28px rgba(0,0,0,.18);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  transition:background-color .35s ease,border-color .35s ease}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--nav-fg);font:inherit;font-size:10px;white-space:nowrap;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:color .35s ease}
nav button svg{width:21px;height:21px}
nav button[aria-current=page]{color:var(--nav-on)}
body{--nav-bg:rgba(255,255,255,.62);--nav-line:rgba(15,23,42,.08);--nav-fg:#64748B;--nav-on:#2563EB;transition:background-color .35s ease}
body.t-home{background:#F2F7FF;--nav-bg:rgba(236,244,255,.66);--nav-line:rgba(37,99,235,.14);--nav-fg:#6A7FA3;--nav-on:#2563EB}
body.t-portfolio{background:#FFFFFF;--nav-bg:rgba(20,17,43,.82);--nav-line:rgba(139,111,224,.25);--nav-fg:#A9A3C9;--nav-on:#C4B5FD}
body.t-lab{background:#0d0a1c;--nav-bg:rgba(24,16,52,.5);--nav-line:rgba(255,255,255,.1);--nav-fg:#9a92c4;--nav-on:#C9A8FF}
body.t-sectors{background:#0b0f0c;--nav-bg:rgba(20,34,16,.5);--nav-line:rgba(255,255,255,.1);--nav-fg:#93A198;--nav-on:#C3F53C}
body.t-finance{background:#EFFBF6;--nav-bg:rgba(232,250,243,.66);--nav-line:rgba(5,150,105,.16);--nav-fg:#5E8A7C;--nav-on:#059669}
#lock{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 600px at 80% -10%,#1d3b8a 0%,transparent 60%),radial-gradient(800px 500px at 0% 110%,#3b1d72 0%,transparent 60%),#0b0f1e}
#lock[hidden]{display:none}
#lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
#lock .ic{width:72px;height:72px;margin:0 auto 6px;border-radius:18px;display:block}
#lock h1{margin:0;font-size:24px;font-weight:800}
#lock p{margin:0;color:#A7B0D0;font-size:14px;line-height:1.5}
#lock input{font:inherit;font-size:17px;text-align:center;direction:ltr;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:#fff}
#lock button{font:inherit;font-size:17px;font-weight:700;padding:14px;border-radius:14px;border:0;background:linear-gradient(135deg,#39d98a,#22b3a6);color:#04170f;cursor:pointer}
#lock .err{color:#FF6B85;font-size:14px;min-height:1.4em}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8C97BA;font-size:14px;z-index:2}
</style>
</head>
<body>
<div id="probe"></div>
<div id="boot">טוען…</div>
<div id="frames"></div>

<nav id="nav" hidden>
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>בית</button>
  <button type="button" data-tab="portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>התיק שלי</button>
  <button type="button" data-tab="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7.5 15h9"/></svg>המעבדה</button>
  <button type="button" data-tab="sectors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>סקטורים</button>
  <button type="button" data-tab="finance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/><path d="M16 15h2.5"/></svg>כספים</button>
</nav>

<div id="lock" hidden>
  <form id="lockf" autocomplete="off">
    <img class="ic" src="icons/icon-192.png" alt="">
    <h1>דף הבית</h1>
    <p>הנתונים שלך מוצפנים. מקלידים את הסיסמה פעם אחת, והמכשיר זוכר אותה.</p>
    <input id="pass" type="password" placeholder="סיסמה" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="submit">פתח</button>
    <div class="err" id="err"></div>
  </form>
</div>

<script src="js/core.js"></script>
<script>
(function () {
  var TABS = ['home', 'portfolio', 'lab', 'sectors', 'finance'];
  var PAGES = { home: 'home.html', portfolio: 'portfolio.html', lab: 'lab.html', sectors: 'sectors.html', finance: 'finance.html' };
  var frames = {}, current = null, dataP = null;
  var $ = function (id) { return document.getElementById(id); };

  window.roy = {
    data: function () { return dataP; },
    go: function (tab, hash) { show(tab, hash || ''); }
  };

  var NAV_H = 52;
  var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  function sizeApp() {
    /* iOS home-screen apps can report a viewport shorter than the screen; use the real screen height there */
    var h = window.innerHeight;
    if (standalone && screen && screen.height) {
      var land = window.innerWidth > window.innerHeight;
      h = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    }
    document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  sizeApp();
  window.addEventListener('orientationchange', function () { setTimeout(function () { sizeApp(); insets(); }, 300); });
  function insets(f) {
    var cs = getComputedStyle($('probe')), top = parseFloat(cs.paddingTop) || 0, bot = parseFloat(cs.paddingBottom) || 0;
    var navBottom = Math.max(6, bot - 12), list = f ? [f] : TABS.map(function (t) { return frames[t]; }).filter(Boolean);
    list.forEach(function (fr) {
      try {
        var de = fr.contentDocument && fr.contentDocument.documentElement; if (!de) return;
        de.style.setProperty('--top-h', top + 'px');
        de.style.setProperty('--nav-h', (NAV_H + navBottom + 12) + 'px');
      } catch (e) {}
    });
  }
  window.addEventListener('resize', function () { sizeApp(); insets(); });
  function frame(tab, hash) {
    var f = frames[tab];
    if (!f) { f = document.createElement('iframe'); f.title = tab; frames[tab] = f; f.addEventListener('load', function () { insets(f); }); $('frames').appendChild(f); }
    if (!f.src || hash) f.src = PAGES[tab] + (hash || '');
    return f;
  }
  function show(tab, hash) {
    if (TABS.indexOf(tab) === -1) tab = 'home';
    var f = frame(tab, hash);
    TABS.forEach(function (t) { if (frames[t]) frames[t].classList.toggle('on', t === tab); });
    document.querySelectorAll('nav button').forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    current = tab;
    document.body.className = 't-' + tab;
    insets(f);
    try { localStorage.setItem('roy-tab', tab); } catch (e) {}
    history.replaceState(null, '', '#' + tab);
  }
  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.tab === current) { try { frames[current].contentWindow.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {} return; }
      show(b.dataset.tab);
    });
  });

  function start(data) {
    dataP = Promise.resolve(data);
    $('lock').hidden = true; $('boot').hidden = true; $('nav').hidden = false;
    var first = location.hash.slice(1);
    if (TABS.indexOf(first) === -1) { try { first = localStorage.getItem('roy-tab') || 'home'; } catch (e) { first = 'home'; } }
    show(first);
  }
  function askPass(msg) {
    $('boot').hidden = true; $('lock').hidden = false; $('err').textContent = msg || '';
  }
  $('lockf').addEventListener('submit', function (e) {
    e.preventDefault();
    var p = $('pass').value; if (!p.trim()) return;
    $('err').textContent = 'בודק…';
    Roy.unlock(p).then(start, function () { $('err').textContent = 'הסיסמה לא נכונה. נסה שוב.'; });
  });

  if (!Roy.hasKey()) askPass();
  else Roy.load().then(start, function (e) {
    if (String(e && e.message).indexOf('bundle') === 0) { $('boot').textContent = 'אין חיבור לאינטרנט. נסה שוב בעוד רגע.'; return; }
    Roy.forget(); askPass('צריך להקליד את הסיסמה מחדש.');
  });
})();
</script>
</body>
</html>
