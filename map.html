<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת הקשרים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --card:#1E2622; --card2:#232D28; --line:#2F3A34; --line2:#3F4C44;
  --neon:#C3F53C; --neon-dim:#86AD2A; --txt:#F2F6F2; --mut:#93A198;
  --crit:#FF5C7A; --strong:#FFB020; --weak:#6B7A70; --il:#4DA3FF; --own:#B5F23D; --thesis:#C77DFF
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{color:var(--txt);font-family:Heebo,system-ui,sans-serif;font-size:14px;line-height:1.45;min-height:100vh;
  background:radial-gradient(1200px 700px at 80% -10%,#2c5a1c 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,#0f3d36 0%,transparent 60%),#0b0f0c;background-attachment:fixed}
.wrap{max-width:900px;margin:0 auto;padding:calc(var(--top-h,0px) + 6px) 12px calc(var(--nav-h,0px) + 28px)}
header{position:relative;text-align:center;padding:10px 0 12px}
.back{position:absolute;right:0;top:12px;background:rgba(255,255,255,.06);border:.5px solid var(--line2);color:var(--neon);font:600 13px Heebo;border-radius:999px;padding:5px 12px;cursor:pointer}
h1{font-weight:900;font-size:30px;line-height:1.1;margin-top:28px}
h1 span{color:var(--neon);text-shadow:0 0 18px rgba(195,245,60,.35)}
.sub{color:var(--mut);margin-top:6px;font-size:13px}
.bar{position:sticky;top:calc(var(--top-h,0px) + 6px);z-index:6;background:rgba(30,38,34,.88);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  padding:9px 12px;margin:6px 0 14px;border:.5px solid rgba(255,255,255,.12);border-radius:18px}
.seg{display:flex;background:rgba(118,118,128,.18);border-radius:10px;padding:2px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:600 12.5px Heebo;padding:6px 4px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--neon);color:#0a0d08}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;color:var(--mut);font-size:11px;margin-top:8px}
.legend b{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-left:5px;border-radius:2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;vertical-align:middle}
.hint{color:var(--mut);font-size:12px;text-align:center;margin:-4px 0 10px}

h2{font-weight:900;font-size:19px;color:var(--neon);margin:26px 0 4px}
.h2s{color:var(--mut);font-size:12.5px;margin-bottom:12px}

.graph{position:relative;padding-top:24px}
.graph svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:1}
.lay{position:relative;z-index:2;display:flex;flex-direction:column;gap:46px}
.row{position:relative;display:flex;gap:8px;justify-content:center;align-items:stretch}
.lvl{position:absolute;right:0;top:-31px;z-index:3;font:600 10px Heebo;color:var(--neon);letter-spacing:.02em;background:#111814;border:.5px solid var(--line2);border-radius:999px;padding:1px 9px;line-height:15px;white-space:nowrap}
.node{position:relative;flex:1;min-width:0;max-width:300px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:8px 9px 9px;cursor:pointer;
  transition:opacity .25s,border-color .25s,transform .15s,box-shadow .25s;text-align:right}
.node:active{transform:scale(.97)}
.row.one .node{max-width:62%}
.node.choke{border-color:rgba(255,92,122,.55)}
.node .nt{font-weight:800;font-size:13.5px;line-height:1.2}
.node .ns{color:var(--mut);font-size:10.5px;margin-top:2px;line-height:1.3}
.node .ck{position:absolute;top:-8px;left:8px;background:#2a1418;color:var(--crit);border:1px solid rgba(255,92,122,.6);border-radius:999px;font:700 9.5px Heebo;padding:0 7px;line-height:15px}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;direction:ltr;justify-content:flex-end}
.c{font:600 10.5px Oswald;letter-spacing:.03em;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:6px;padding:0 5px;line-height:17px;color:var(--txt)}
.c.own{border-color:var(--own);color:var(--own);background:rgba(181,242,61,.1)}
.c.th{border-color:rgba(199,125,255,.7)}
.c.il{direction:rtl;font:600 11px Heebo;letter-spacing:0;border-color:var(--il)}
.tk.il{border-color:rgba(77,163,255,.6)}
.tk .sales{display:block;font-size:11px;color:var(--mut);margin-top:1px}
.graph.sel .node{opacity:.28}
.graph.sel .node.on,.graph.sel .node.nb{opacity:1}
.graph.sel .node.on{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 22px rgba(195,245,60,.25)}
path.e{fill:none;transition:opacity .25s,stroke-width .25s}
path.e.c{stroke:var(--crit);stroke-width:2.4}
path.e.s{stroke:var(--strong);stroke-width:1.8}
path.e.w{stroke:var(--weak);stroke-width:1.5;stroke-dasharray:4 4}
path.e.m{stroke:var(--il);stroke-width:1.6;stroke-dasharray:2 5}
.graph.crit path.e:not(.c){opacity:.08}
.graph.sel path.e{opacity:.07}
.graph.sel path.e.on{opacity:1;stroke-width:3}

.cards{display:grid;gap:8px}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.card h3{font-size:14px;font-weight:800;display:flex;gap:7px;align-items:center}
.card h3 i{width:8px;height:8px;border-radius:50%;background:var(--crit);flex:none}
.card p{color:var(--mut);font-size:12.5px;margin-top:3px;line-height:1.5}
.money{background:linear-gradient(135deg,rgba(195,245,60,.10),rgba(61,220,192,.06));border:1px solid rgba(195,245,60,.3);border-radius:14px;padding:11px 13px;margin-top:10px}
.money b{color:var(--neon)}
.money p{font-size:12.5px;color:#cfd8d2;line-height:1.55}
footer{margin-top:28px;text-align:center;color:var(--mut);font-size:11px;line-height:1.6}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);border:.5px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:78vh;overflow:auto;
  padding:16px 18px calc(var(--nav-h,0px) + 16px);animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet h3{font-size:20px;font-weight:900}
.sheet .what{color:#d6ded9;font-size:13.5px;margin-top:6px;line-height:1.55}
.sheet .blk{margin-top:14px}
.sheet .blk h4{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:5px}
.lnk{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:.5px solid var(--line);font-size:13.5px;cursor:pointer}
.lnk:first-of-type{border-top:0}
.lnk i{width:9px;height:9px;border-radius:50%;flex:none}
.lnk small{color:var(--mut);margin-inline-start:auto;font-size:11px}
.gone{background:rgba(255,92,122,.08);border:1px solid rgba(255,92,122,.3);border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.5}
.gone b{color:var(--crit)}
.tks{display:grid;gap:5px}
.tk{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:.5px solid var(--line2);border-radius:10px;padding:6px 10px}
.tk .sym{font:700 14px Oswald;letter-spacing:.03em;direction:ltr;min-width:58px;text-align:right}
.tk .nm{font-size:12.5px;color:#cfd8d2;flex:1;min-width:0}
.tag{font:700 10px Heebo;border-radius:999px;padding:1px 8px;border:1px solid}
.tag.own{color:var(--own);border-color:rgba(181,242,61,.5)}
.tag.th{color:var(--thesis);border-color:rgba(199,125,255,.5)}
.tag.il{color:var(--il);border-color:rgba(77,163,255,.5)}
.close{display:block;width:100%;margin-top:16px;background:transparent;border:1px solid var(--neon);color:var(--neon);font:700 14px Heebo;border-radius:12px;padding:10px;cursor:pointer}
.tabs{display:flex;gap:2px;background:rgba(118,118,128,.18);border-radius:11px;padding:2px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:none;color:var(--mut);font:600 12.5px Heebo;padding:7px 9px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--neon);color:#0a0d08}
.tools{display:flex;align-items:center;gap:10px;margin-top:8px}
.tools .legend{margin-top:0;flex:1;justify-content:flex-start;gap:10px}
.tgl{flex:none;border:1px solid var(--line2);background:transparent;color:var(--mut);font:600 11.5px Heebo;border-radius:999px;padding:4px 10px;cursor:pointer}
.tgl.on{border-color:var(--crit);color:var(--crit);background:rgba(255,92,122,.1)}
.more{display:none;color:var(--mut);font-size:11px;text-align:center;margin-top:6px}
.node.force{background:var(--card2);border-style:dashed}
.node.force .nt{color:#dfe7e2}
#pane{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* stock card link */
.tk.has{cursor:pointer}
.tk.has:active{transform:scale(.98)}
.tk .go{color:var(--neon);font-size:15px;font-weight:700;margin-inline-start:2px}
</style>
<link rel="stylesheet" href="apple.css?v=1">
</head>
<body data-tab="map">
<div class="wrap">
<header>
  <button class="back" id="back">› סקטורים</button>
  <h1>מפת <span>הקשרים</span></h1>

</header>

<div class="bar">
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <div class="legend">
      <span><b style="border-color:var(--crit)"></b>הכרחי</span>
      <span><b style="border-color:var(--strong)"></b>חזק</span>

      <span><i style="background:var(--own)"></i>בתיק</span>
      <span><i style="background:var(--thesis)"></i>תזה</span>
      <span><i style="background:transparent;border:1.5px solid var(--il);border-radius:3px"></i>ישראלית</span>

  </div>
</div>

<div id="pane"></div>

<footer>מפה חינוכית, לא המלצה. הקשרים הם הערכה כללית ומשתנים עם הזמן.</footer>

function chip(k){ const cl=["c"]; if(OWN.has(k)) cl.push("own"); if(THESIS.has(k)) cl.push("th"); if(ISR.has(k)) cl.push("il");

function draw(){
  const el=$("g"); if(!el||!cur) return;
  const G=cur.G, svg=el.querySelector("svg"), box=el.getBoundingClientRect(), R={};
  el.querySelectorAll(".node").forEach(n=>{ const r=n.getBoundingClientRect(); R[n.dataset.id]={x:r.left-box.left,y:r.top-box.top,w:r.width,h:r.height,row:G.rows.findIndex(rw=>rw.includes(n.dataset.id))}; });
  svg.setAttribute("width",box.width); svg.setAttribute("height",box.height);
  const cx=id=>R[id].x+R[id].w/2;
  /* each line gets its own anchor on the box side it uses, ordered by where it goes, so lines don't overlap */
  const groups={}, ax={};
  G.edges.forEach((e,i)=>{ const A=R[e[0]],B=R[e[1]]; if(A.row===B.row) return; const down=A.row<B.row;
    (groups[e[0]+(down?"b":"t")]=groups[e[0]+(down?"b":"t")]||[]).push([i,"o",e[1]]);
    (groups[e[1]+(down?"t":"b")]=groups[e[1]+(down?"t":"b")]||[]).push([i,"i",e[0]]); });
  Object.keys(groups).forEach(key=>{ const id=key.slice(0,-1), r=R[id], L=groups[key].sort((a,b)=>cx(a[2])-cx(b[2])), span=Math.min(r.w*.6,(L.length-1)*20);
    L.forEach((it,j)=>{ ax[it[0]+it[1]]=r.x+r.w/2+(L.length>1?(j/(L.length-1)-.5)*span:0); }); });
  let defs="<defs>"; for(const k in LC) defs+=`<marker id="a${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${LC[k]}"/></marker>`; defs+="</defs>";
  svg.innerHTML=defs+G.edges.map((e,i)=>{ const a=R[e[0]],b=R[e[1]]; let d;
    if(a.row===b.row){ const ltr=a.x<b.x, x1=ltr?a.x+a.w:a.x, x2=ltr?b.x-2:b.x+b.w+2, y=Math.min(a.y+a.h/2,b.y+b.h/2); d=`M${x1} ${y} L${x2} ${y}`; }
    else { const down=a.row<b.row, dir=down?1:-1, x1=ax[i+"o"], y1=down?a.y+a.h:a.y, x2=ax[i+"i"], y2=(down?b.y:b.y+b.h)-dir*3, m=Math.abs(y2-y1)*.55;
      d=`M${x1} ${y1} C${x1} ${y1+dir*m},${x2} ${y2-dir*m},${x2} ${y2}`; }
    return `<path class="e ${e[2]}" data-a="${e[0]}" data-b="${e[1]}" d="${d}" marker-end="url(#a${e[2]})"/>`; }).join("");
  mark();
}

function mark(){
  const el=$("g"); if(!el) return;
  el.classList.toggle("sel",!!sel);
  el.querySelectorAll(".node").forEach(n=>n.classList.remove("on","nb"));
  el.querySelectorAll("path.e").forEach(p=>p.classList.remove("on"));
  if(!sel) return;
  el.querySelector(`.node[data-id="${sel}"]`).classList.add("on");
  el.querySelectorAll("path.e").forEach(p=>{ if(p.dataset.a===sel||p.dataset.b===sel){ p.classList.add("on");
    el.querySelector(`.node[data-id="${p.dataset.a===sel?p.dataset.b:p.dataset.a}"]`).classList.add("nb"); } });
}
function select(id){ sel=id; mark(); openSheet(id); }

    const il=ISR.has(k); return `<div class="tk${il?" il":""}${isTk(k)||ISR.has(k)?" has":""}" data-k="${k}"><span class="sym">${il?"":(isTk(k)?k:"")}</span><span class="nm">${NAMES[k]||k}${il&&SALES[k]?`<span class="sales">מוכרת ל: ${SALES[k]}</span>`:""}</span>${tags}${isTk(k)||ISR.has(k)?'<span class="go">›</span>':""}</div>`; }).join("");
  $("sheet").innerHTML=`<div class="grab"></div><h3>${n.t}</h3><div class="what">${n.what}</div>
   ${from.length?`<div class="blk"><h4>${n.f?"מושפע מ":"תלוי ב"}</h4>${from.map(e=>line(e[0],e[2])).join("")}</div>`:""}
   ${to.length?`<div class="blk"><h4>${n.f?"משפיע על":"מזין את"}</h4>${to.map(e=>line(e[1],e[2])).join("")}</div>`:""}
   <div class="blk"><div class="gone"><b>${n.gl||"אם הוא נעלם"}: </b>${n.gone}</div></div>
   ${tks?`<div class="blk"><h4>המניות כאן</h4><div class="tks">${tks}</div></div>`:""}
   <button class="close" id="cls">סגור</button>`;
  $("ov").classList.add("on"); $("sheet").scrollTop=0;
  $("cls").onclick=closeSheet;
  document.querySelectorAll(".lnk").forEach(l=>l.onclick=()=>{ select(l.dataset.go); });
  document.querySelectorAll(".tk.has").forEach(t=>t.onclick=()=>{ closeSheet(); Roy.go("sectors","#k-"+t.dataset.k); });
}

function closeSheet(){ $("ov").classList.remove("on"); sel=null; mark(); }
$("ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeSheet(); });

$("tabs").innerHTML=TABS.map(t=>`<button data-id="${t.id}">${t.t}</button>`).join("");
$("tabs").onclick=e=>{ const b=e.target.closest("button"); if(b&&b.dataset.id!==cur.id){ render(TABS.find(t=>t.id===b.dataset.id)); window.scrollTo({top:0}); } };
$("crit").onclick=()=>{ critOnly=!critOnly; $("crit").classList.toggle("on",critOnly); const g=$("g"); if(g) g.classList.toggle("crit",critOnly); };
$("back").onclick=()=>Roy.go("sectors");

let first="forces"; try{ first=localStorage.getItem("roy-map-tab")||"forces"; }catch(e){}
render(TABS.find(t=>t.id===first)||TABS[0]);
window.addEventListener("resize",draw);
window.addEventListener("load",draw);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
if(window.ResizeObserver) new ResizeObserver(draw).observe($("pane"));

/* Mark what's actually in the portfolio, from the app's data */
Roy.data().then(d=>{
  const h=((d.datasets&&d.datasets.holdings)||[]).map(x=>String(x.ticker||"").toUpperCase()).filter(Boolean);
  if(!h.length) return;
  const own=new Set(h); ["ESLT","NXSN","TASE","POLI","LUMI","TA125","NKE"].forEach(k=>own.add(k));
  OWN=own; render(cur);
},()=>{});
</script>
