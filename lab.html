<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>המעבדה</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Heebo,system-ui,sans-serif;color:#ece8ff;min-height:100vh;
background:radial-gradient(1200px 700px at 80% -10%,#4a3794 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,#2d1f66 0%,transparent 60%),#171230;background-attachment:fixed}
#app{max-width:720px;margin:0 auto;padding:calc(var(--top-h,0px) + 14px) 14px calc(var(--nav-h,0px) + 24px)}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit}
h1{margin:0;font-size:24px;font-weight:800;color:#fff;text-shadow:0 0 18px #8f6bff88}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.top.home{flex-direction:column;justify-content:center;text-align:center;gap:2px;margin:8px 0 18px}
.dt{color:#a99fd6;font-size:13px}.st{font-size:11px;color:#a99fd6;min-height:1em}
.add{display:flex;align-items:center;gap:8px;background:#ffffff0a;border:1px solid #ffffff1a;border-radius:14px;padding:8px;margin-bottom:12px}
.add input{flex:1 1 auto;text-transform:uppercase;background:#00000040;border:1px solid #ffffff22;color:#fff;border-radius:10px;padding:10px 12px;font-size:16px;min-width:0;direction:ltr;text-align:right}
.btn{background:linear-gradient(135deg,#39ff88,#22c3a6);color:#062016;border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:15px;white-space:nowrap}
.ghost{background:transparent;border:1px solid #ffffff2a;color:#d7d0ff;border-radius:10px;padding:8px 12px;font-size:14px}
.ghost.entry{display:block;width:100%;margin:0 0 16px;padding:11px;border-color:#ffd16666;color:#ffd166;font-weight:700}
.empty{color:#a99fd6;text-align:center;padding:30px 0}
.card{display:block;width:100%;text-align:right;background:#ffffff0c;border:1px solid #ffffff1c;border-radius:16px;padding:14px;margin-bottom:10px}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk{font-size:22px;font-weight:800;letter-spacing:.5px;color:#fff;direction:ltr}
.nm{color:#bdb4e8;font-size:14px}
.chip{font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid #b18cff88;color:#cdb6ff}
.pill{margin-inline-start:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s-check{color:#3ee6ff}.s-pass{color:#39ff88}.s-fail{color:#ff5c7a}.s-cut{color:#ff9f43}.s-held{color:#cdb6ff}
.bar{height:6px;background:#ffffff14;border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#39ff88,#22c3a6);border-radius:9px}
.cnt{display:flex;gap:14px;align-items:center;font-size:13px;color:#bdb4e8}
.cnt b{color:#fff}
.why{font-size:13px;color:#bdb4e8;margin-top:6px;line-height:1.45}
.d{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:#ffffff26}
.d.g{background:#39ff88;box-shadow:0 0 6px #39ff8888}.d.y{background:#ffe14d;box-shadow:0 0 6px #ffe14d88}.d.r{background:#ff5c7a;box-shadow:0 0 6px #ff5c7a88}.d.n{background:#6b6590}
.back{background:none;border:0;color:#d7d0ff;font-size:15px;padding:6px 0}
.sh{margin:2px 0 8px}.sh .tk{font-size:30px}
.strip{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#a99fd6;margin:2px 0 10px}
.strip b{color:#fff;font-weight:600}.n2{direction:ltr;unicode-bidi:isolate;display:inline-block}.up{color:#39ff88!important}.dn{color:#ff5c7a!important}
.types{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.types button{background:#00000030;border:1px solid #ffffff22;border-radius:99px;padding:6px 12px;font-size:13px;color:#bdb4e8}
.types button.on{border-color:#b18cff;color:#fff;background:#b18cff33}
.types.need button{border-color:#ffe14d66}
.panel{background:#ffffff0a;border:1px solid #ffffff1a;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.ph h3{margin:0;font-size:16px;color:#fff;flex:1}
.ph .c{font-size:12px;color:#a99fd6}
.banner{border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.45;margin:8px 0 0}
.banner.red{background:#ff5c7a1f;border:1px solid #ff5c7a66;color:#ffb3c0}
.banner.yel{background:#ffe14d14;border:1px solid #ffe14d55;color:#ffe9a0}
.banner.grn{background:#39ff8814;border:1px solid #39ff8855;color:#9fe9bd}
.banner.vio{background:#b18cff1a;border:1px solid #b18cff66;color:#e2d4ff}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stats button{flex:1 1 auto;background:#00000030;border:1px solid #ffffff22;color:#bdb4e8;border-radius:10px;padding:8px 6px;font-size:13.5px;font-weight:700}
.stats button.on.s-check{border-color:#3ee6ff;color:#3ee6ff}.stats button.on.s-pass{border-color:#39ff88;color:#39ff88}.stats button.on.s-fail{border-color:#ff5c7a;color:#ff5c7a}.stats button.on.s-cut{border-color:#ff9f43;color:#ff9f43}
.stats button.lock{opacity:.55}
.stats button.confirm,.seg2 button.confirm{border-color:#ff9f43!important;color:#ff9f43!important;background:#ff9f4322!important}
.f label{display:block;font-size:12.5px;color:#a99fd6;margin-top:12px}
.f textarea,.f input{width:100%;margin-top:4px;background:#00000045;border:1px solid #ffffff2a;border-radius:10px;color:#fff;padding:9px 10px;font-size:16px}
.f textarea{min-height:52px;resize:vertical}
.f .two{display:flex;gap:8px}.f .two>*{flex:1}
.seg2{display:flex;gap:6px;margin-top:4px}
.seg2 button{flex:1;background:#00000030;border:1px solid #ffffff22;border-radius:10px;padding:8px;font-size:13.5px;color:#bdb4e8}
.seg2 button.on{border-color:#b18cff;color:#fff;background:#b18cff33}
.miss{font-size:12.5px;color:#ffe14d;margin-top:6px}
.prog{height:5px;background:#ffffff14;border-radius:5px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:#39ff88}
.cq{display:flex;align-items:center;gap:9px;padding:11px 0;border-top:1px solid #ffffff10;cursor:pointer}
.cq:first-of-type{border-top:0}
.cq .t{font-weight:700;color:#fff;width:62px;flex:none;font-size:14.5px}
.cq .a{flex:1;color:#bdb4e8;font-size:13.5px;line-height:1.4;min-width:0}
.cq .a.miss2{color:#6f6896}
.cq .car{color:#6f6896;font-size:12px}
.tag{font-size:11px;padding:1px 7px;border-radius:7px;white-space:nowrap}
.tag.red{color:#ff5c7a;background:#ff5c7a1f}.tag.yel{color:#ffe14d;background:#ffe14d1a}
.open{background:#00000026;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.q{font-size:12.5px;color:#a99fd6;margin-bottom:6px}
.open input.ans{width:100%;background:#00000045;border:1px solid #ffffff2a;border-radius:10px;color:#fff;padding:9px 10px;font-size:16px}
.fl{display:flex;gap:6px;margin-top:8px}
.fl button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#00000030;border:1px solid #ffffff22;border-radius:10px;padding:7px 4px;font-size:13px;color:#bdb4e8}
.fl button.on.g{border-color:#39ff88;color:#39ff88}.fl button.on.y{border-color:#ffe14d;color:#ffe14d}.fl button.on.r{border-color:#ff5c7a;color:#ff5c7a}.fl button.on.n{border-color:#9a92c4;color:#fff}
.ms{margin-top:10px}
.m{display:grid;grid-template-columns:1fr auto 12px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #ffffff0d;font-size:13.5px;cursor:pointer}
.m .v{color:#fff;direction:ltr;text-align:left}
.m.na .v,.m.na span:first-child{color:#6f6896}
.m small{display:block;color:#8f87b8;font-size:11.5px}
.me{background:#00000030;border:1px solid #ffffff14;border-radius:10px;padding:8px 10px;margin:4px 0 8px}
.me .f label{margin-top:8px}
.me .f input{padding:7px 9px}
.hint{font-size:12px;color:#8f87b8;margin-top:16px;line-height:1.6}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.ghost.warn{border-color:#ff5c7a;color:#ff5c7a}
.old{white-space:pre-wrap;font-size:13px;color:#bdb4e8;line-height:1.55;margin-top:8px}
.peak .qq{margin-top:10px;font-size:13.5px;color:#e2d4ff}
</style><link rel="stylesheet" href="apple.css?v=1">
</head><body data-tab="lab"><div id="app"><div class="empty">טוען…</div></div>
<script src="js/core.js?v=15"></script>
<script>
(function () {
var LK = 'srl-data-v1', UK = 'srl-ui-v2', PK = 'roy-peaks';
var MAXCAP = 12, MINCASH = 25, STALE = 90;
var CORE = [
  ['biz', 'העסק', 'מה החברה מוכרת, ולמי?'],
  ['grow', 'צמיחה', 'האם ההכנסות והרווח גדלו בשנים האחרונות?'],
  ['prof', 'רווחיות', 'האם החברה מרוויחה, והאם הרווח יציב?'],
  ['res', 'חוסן', 'האם החברה תשרוד שנה רעה?'],
  ['moat', 'יתרון', 'למה לקוחות בוחרים בה ולא במתחרה?'],
  ['risk', 'סיכון', 'מה הדבר האחד שיכול לשבור את התזה? אדום כאן פוסל.'],
  ['price', 'מחיר', 'האם המחיר הגיוני ביחס לסקטור ולעבר שלה?']
];
/* key: [name, core question, hint] */
var MET = {
  rev: ['הכנסות', 'grow', 'שנתי, ולאן הולך'], eps: ['EPS', 'grow', 'רווח למניה'], eg5: ['צמיחת EPS ל 5 שנים', 'grow', '% בשנה'],
  backlog: ['צבר הזמנות', 'grow', 'סכום, או כמה שנות מכירות'],
  nm: ['שולי רווח נקי', 'prof', '%'], roe: ['ROE', 'prof', 'תשואה על ההון %'], roa: ['ROA', 'prof', 'תשואה על הנכסים %'],
  debt: ['חוב', 'res', 'חוב נטו, או חוב מול רווח'], cr: ['נכסים שוטפים מול התחייבויות קצרות', 'res', 'יחס'], fcf: ['תזרים', 'res', 'תזרים חופשי'],
  pe: ['P/E', 'price', 'מכפיל רווח'], peg: ['PEG', 'price', 'מכפיל מול צמיחה'], pb: ['P/B מכפיל הון', 'price', 'מחיר מול הון עצמי'], div: ['דיבידנד', 'price', 'תשואה %']
};
var BASE = ['rev', 'eps', 'pe'];
var TYPES = {
  growth: { n: 'צמיחה', m: ['eg5', 'nm', 'fcf', 'debt', 'peg'] },
  value: { n: 'ערך ודיבידנד', m: ['fcf', 'debt', 'cr', 'roe', 'div'] },
  fin: { n: 'פיננסים', m: ['roe', 'roa', 'div', 'pb'], na: ['debt', 'cr', 'fcf'] },
  def: { n: 'ביטחון ותעשייה', m: ['backlog', 'nm', 'debt', 'cr', 'fcf'] }
};
var ST = { check: 'בבדיקה', pass: 'עוברת', fail: 'לא עוברת', cut: 'נחתכה, מחכה לכניסה', held: 'בתיק' };
var GATE = ['thesis', 'exit', 'cap', 'money', 'corr'];
var GATEN = { thesis: 'תזה', exit: 'תנאי יציאה', cap: 'תקרת משקל', money: 'מקור כסף', corr: 'מתאם' };

var D = {}, S, UI, PR = {}, HOLD = {}, ACC = {}, TOTAL = 0, PRE = '', status = '', pendDel = null, pendCut = null, gateMsg = '';
var app = document.getElementById('app');

function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dmy(s) { if (!s) return ''; var p = String(s).split('-'); return +p[2] + '.' + (+p[1]) + '.' + p[0]; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid() { return Math.random().toString(36).slice(2, 9); }
function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(/[,₪%\s]/g, '')); return isFinite(n) ? n : null; }
function r1(v) { return Math.round(v * 10) / 10; }
function filled(v) { return v != null && String(v).trim() !== ''; }
function days(iso) { return iso ? (Date.now() - new Date(iso + 'T00:00:00').getTime()) / 864e5 : 1e9; }

/* ---------- sync ---------- */
function syncer() { try { if (window.parent !== window && window.parent.Roy && window.parent.Roy._sync) return window.parent.Roy._sync; } catch (e) {} return window.Roy && Roy._sync; }
function pushData(path, val) {
  var p = path.split('.'), o = D; for (var i = 0; i < p.length - 1; i++) { if (!o[p[i]]) o[p[i]] = {}; o = o[p[i]]; } o[p[p.length - 1]] = val;
  var s = syncer(); if (s) s.push([{ k: 'd:' + path, v: JSON.stringify(val), ts: Date.now() }]);
}
var rT = null;
function save() {
  S.ts = Date.now();
  try { localStorage.setItem(LK, JSON.stringify(S)); status = 'נשמר ✓'; } catch (e) { status = 'שגיאת שמירה'; }
  var el = document.getElementById('st'); if (el) el.textContent = status;
  clearTimeout(rT); rT = setTimeout(function () { pushData('datasets.research', S.stocks.map(summary)); if (el) el.textContent = ''; }, 1500);
}
function saveUI() { try { localStorage.setItem(UK, JSON.stringify(UI)); } catch (e) {} }

/* ---------- model ---------- */
function mList(s) {
  var t = TYPES[s.type], keys = BASE.concat(t ? t.m.concat(t.na || []) : []), out = {};
  CORE.forEach(function (c) { out[c[0]] = []; });
  Object.keys(MET).forEach(function (k) { if (keys.indexOf(k) > -1) out[MET[k][1]].push(k); });
  return out;
}
function mVal(s, k) { var m = s.m[k] || {}; var auto = TYPES[s.type] && (TYPES[s.type].na || []).indexOf(k) > -1; return { v: m.v, f: m.f, why: m.why, src: m.src, dt: m.dt, na: m.na != null ? m.na : auto }; }
function isHeld(s) { return !!HOLD[String(s.tk).toUpperCase()]; }
function stOf(s) { if (s.status === 'cut') return 'cut'; if (isHeld(s)) return 'held'; return s.status || 'check'; }
function counts(s) {
  var r = { g: 0, y: 0, r: 0, done: 0 };
  CORE.forEach(function (c) { var x = s.core[c[0]] || {}; if (x.f) { r[x.f]++; } if (filled(x.a) || x.f) r.done++; });
  r.pct = Math.round(r.done / CORE.length * 100); return r;
}
function staleN(s) { var n = 0; Object.keys(s.m).forEach(function (k) { var m = s.m[k]; if (m && !m.na && filled(m.v) && days(m.dt) > STALE) n++; }); return n; }
function gateMiss(s) { var g = s.gate; return GATE.filter(function (k) { return !filled(g[k]); }); }
function gateWarn(s) {
  var g = s.gate, w = [], cap = num(g.cap), money = num(g.money);
  if (cap != null && cap > MAXCAP) w.push('תקרה של ' + cap + '% גבוהה מהתקרה הכי גבוהה בתיק היום (' + MAXCAP + '%).');
  if (money != null && TOTAL) {
    var cash = Number(ACC.cash_ils) || 0, after = (cash - money) / TOTAL * 100;
    if (after < MINCASH) w.push('הקנייה מורידה את המזומן בתיק ל ' + r1(after) + '%, מתחת למינימום ' + MINCASH + '%.');
    if (cap != null && money > TOTAL * cap / 100 * 1.02) w.push('הסכום גבוה מהתקרה שקבעת: ' + cap + '% מהתיק הם כ ₪' + Math.round(TOTAL * cap / 100).toLocaleString() + '.');
  }
  if (g.corr === 'adds') w.push('המניה מוסיפה לאותו סיכון שכבר יש בתיק' + (topLine() ? ' (' + topLine() + ')' : '') + '.');
  return w;
}
function topLine() {
  if (!TOTAL) return '';
  return Object.keys(HOLD).map(function (k) { return HOLD[k]; }).filter(function (h) { return Number(h.value_ils) > 0; })
    .sort(function (a, b) { return b.value_ils - a.value_ils; }).slice(0, 3)
    .map(function (h) { return h.name + ' ' + r1(h.value_ils / TOTAL * 100) + '%'; }).join(', ');
}
function reds(s) { return CORE.filter(function (c) { return (s.core[c[0]] || {}).f === 'r'; }); }
function canPass(s) { return !gateMiss(s).length && !reds(s).length; }
function summary(s) {
  var c = counts(s), g = s.gate;
  return { ticker: s.tk, name: s.nm || s.tk, held: isHeld(s), verdict: ST[stOf(s)], review_date: s.rev || '', pct: c.pct, done: c.done, total: CORE.length,
    ok: c.g, q: c.y, flags: c.r, why: g.thesis || '', buy_when: '', sell_if: g.exit || '', why_now: '', max_w: num(g.cap), group: s.grp || '', type: s.type ? TYPES[s.type].n : '', updated: today() };
}
function blank(tk) { return { id: uid(), tk: tk, nm: '', type: '', status: 'check', gate: {}, core: {}, m: {}, c: Date.now(), u: Date.now() }; }

/* Old checklist (69 questions) to the new model: keep the thesis, keep what was checked as a note. */
function migrate(old) {
  var T = {}; (function w(a) { (a || []).forEach(function (x) { if (x.k) w(x.k); else T[x.id] = x.t; }); })(old.tree);
  return { v: 2, ts: Date.now(), stocks: (old.stocks || []).map(function (o) {
    var s = blank(o.tk); s.id = o.id; s.nm = o.nm || ''; s.c = o.c || Date.now(); s.u = o.u || Date.now(); s.rev = o.rev || ''; if (o.th && o.th.grp) s.grp = o.th.grp;
    var th = o.th || {}; s.gate = { thesis: th.why || '', exit: th.sell || '', cap: th.max == null ? '' : th.max };
    if (o.verdict === 3) s.status = 'fail';
    var ok = [], q = [], fl = [];
    Object.keys(o.st || {}).forEach(function (id) { var v = o.st[id]; if (!T[id]) return; var line = T[id] + (v.n ? ': ' + v.n : ''); if (v.s === 1) ok.push(line); else if (v.s === 2) q.push(line); else if (v.s === 3) fl.push(line); });
    var L = [];
    if (ok.length) L.push('נבדק:\n' + ok.map(function (x) { return '✓ ' + x; }).join('\n'));
    if (q.length) L.push('נבדק חלקית:\n' + q.map(function (x) { return '? ' + x; }).join('\n'));
    if (fl.length) L.push('דגלים:\n' + fl.map(function (x) { return '! ' + x; }).join('\n'));
    if (th.buy) L.push('קונה אם: ' + th.buy); if (th.now) L.push('למה עכשיו: ' + th.now);
    s.old = L.join('\n\n');
    return s;
  }) };
}

/* ---------- views ---------- */
function fmtPrice(p) {
  if (!p || p.price == null) return '';
  var v = Number(p.price);
  if (p.cur === 'ILA') return '₪' + (v / 100).toFixed(2);
  if (p.cur === 'ILS') return '₪' + v.toFixed(2);
  return '$' + v.toFixed(2);
}
function card(s) {
  var c = counts(s), st = stOf(s), sn = staleN(s);
  var h = '<button class="card" data-act="open" data-id="' + s.id + '"><div class="ch"><span class="tk">' + esc(s.tk) + '</span><span class="nm">' + esc(s.nm) + '</span>' +
    (s.type ? '<span class="chip">' + TYPES[s.type].n + '</span>' : '') + '<span class="pill s-' + st + '">' + ST[st] + '</span></div>';
  h += '<div class="bar"><i style="width:' + c.pct + '%"></i></div><div class="cnt"><span><b>' + c.done + '</b>/7 ליבה</span>' +
    '<span><span class="d g"></span> <b>' + c.g + '</b></span><span><span class="d y"></span> <b>' + c.y + '</b></span><span><span class="d r"></span> <b>' + c.r + '</b></span>' +
    (sn ? '<span class="tag yel">לרענן ' + sn + '</span>' : '') + (c.r ? '<span class="tag red">פוסל</span>' : '') + '</div>';
  if (s.gate.thesis) h += '<div class="why">' + esc(s.gate.thesis) + '</div>';
  return h + '</button>';
}
function vHome() {
  var h = '<header class="top home"><h1>המעבדה</h1><div class="dt">' + esc(Roy.today()) + '</div><span class="st" id="st">' + esc(status) + '</span></header>';
