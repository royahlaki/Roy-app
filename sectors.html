<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת סקטורים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101412; --card:#1E2622; --tile:#29332D; --line:#2F3A34; --line2:#3F4C44; --star:#C77DFF;
  --neon:#C3F53C; --neon-dim:#86AD2A; --txt:#F2F6F2; --mut:#93A198;
  --hot:#FFB020; --il:#4DA3FF; --own:#B5F23D; --spec:#FF5C7A;
  --s0:#C77DFF;--s1:#FFB020;--s2:#3DDCC0;--s3:#6B7A70
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{color:var(--txt);font-family:Heebo,system-ui,sans-serif;font-size:14px;line-height:1.45;min-height:100vh;
  background:radial-gradient(1200px 700px at 80% -10%,#2c5a1c 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,#0f3d36 0%,transparent 60%),#0b0f0c;background-attachment:fixed}
h1 span{text-shadow:0 0 18px rgba(195,245,60,.35)}
.wrap{max-width:1400px;margin:0 auto;padding:calc(var(--top-h,0px) + 6px) 14px calc(var(--nav-h,0px) + 24px)}
@media(min-width:900px){.wrap{padding:calc(var(--top-h,0px) + 16px) 36px calc(var(--nav-h,0px) + 40px)}.row{grid-template-columns:240px 1fr}.tiles{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))}}
header{text-align:center;padding:10px 0 16px}
.maplink{margin-top:10px;background:rgba(195,245,60,.1);border:1px solid rgba(195,245,60,.45);color:var(--neon);font:700 13px Heebo;border-radius:999px;padding:6px 16px;cursor:pointer}
.kick{font-family:Oswald;letter-spacing:.3em;color:var(--neon-dim);font-size:12px}
h1{font-weight:900;font-size:34px;line-height:1.1;margin-top:4px}
h1 span{color:var(--neon)}
.sub{color:var(--mut);margin-top:6px;font-size:13px}
.bar{position:sticky;top:calc(var(--top-h,0px) + 6px);z-index:5;background:rgba(30,38,34,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:16px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.f{background:transparent;border:1px solid var(--line2);color:var(--txt);padding:4px 12px;border-radius:999px;font:600 12px Heebo;cursor:pointer;transition:background .15s,border-color .15s}
.f.on{background:var(--neon);color:#0a0d08;border-color:var(--neon)}
#q{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--line2);color:var(--txt);border-radius:999px;padding:5px 14px;font:16px Heebo;outline:none}
#q:focus{border-color:var(--neon)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:11px;margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;vertical-align:middle}
.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.sec-h h2{font-weight:900;font-size:18px;color:var(--neon)}
.sec-h .en{font-family:Oswald;letter-spacing:.15em;font-size:11px;color:var(--mut)}
.row{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.row.hot{border-color:rgba(255,176,32,.35)}
.lbl{min-width:0}
.lbl h3{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.lbl .num{font-family:Oswald;color:var(--neon);font-size:14px;font-weight:500}
.lbl p{color:var(--mut);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font:700 10px Heebo;border-radius:999px;padding:1px 8px}
.badge.hot{background:rgba(255,176,32,.14);color:var(--hot);border:1px solid rgba(255,176,32,.5)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;align-content:start}
.t{position:relative;background:var(--tile);border:1px solid var(--line2);border-radius:9px;padding:6px 9px;cursor:pointer;text-align:right;color:inherit;font:inherit;transition:border-color .15s,transform .15s}
.t:active{transform:scale(.97)}
.t.own{border-color:var(--own);box-shadow:0 0 0 1px rgba(181,242,61,.35) inset}
.t .tk{font-family:Oswald;font-weight:700;font-size:15px;letter-spacing:.03em;direction:ltr;text-align:right;line-height:1.25}
.t .nm{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{position:absolute;top:8px;left:8px;display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%}
.d-il{background:var(--il)} .d-own{background:var(--own)} .d-spec{background:var(--spec)}
.d-s0{background:var(--s0)} .d-s1{background:var(--s1)} .d-s2{background:var(--s2)} .d-s3{background:var(--s3)}
.t.w.s0{border-color:var(--s0)} .t.w.s1{border-color:var(--s1)} .t.w.s2{border-color:var(--s2)} .t.w.s3{opacity:.45}
.empty{color:var(--mut);text-align:center;padding:30px}
.sync{margin-inline-start:auto;color:var(--mut);font:600 11px Heebo}
.stt{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.sb{border:1px solid var(--line2);background:transparent;color:var(--txt);border-radius:999px;padding:4px 12px;font:600 12px Heebo;cursor:pointer}
.sb.on.s0{background:var(--s0);border-color:var(--s0);color:#14051f} .sb.on.s1{background:var(--s1);border-color:var(--s1);color:#1f1400}
.sb.on.s2{background:var(--s2);border-color:var(--s2);color:#04201b} .sb.on.s3{background:var(--s3);border-color:var(--s3);color:#fff}
.sb.rm{color:var(--mut);border-style:dashed}
#note{width:100%;margin-top:10px;min-height:72px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;color:var(--txt);font:16px/1.5 Heebo;padding:8px 10px;resize:vertical;outline:none}
#note:focus{border-color:var(--neon-dim)}
footer{margin-top:30px;text-align:center;color:var(--mut);font-size:11px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:18px 18px calc(var(--nav-h,0px) + 16px);animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh-top{display:flex;align-items:center;gap:10px}
.sh-top .tk{font-family:Oswald;font-weight:700;font-size:28px;color:var(--neon);direction:ltr}
.sh-top .x{margin-inline-start:auto;background:none;border:1px solid var(--line2);color:var(--txt);border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:15px}
.sh-nm{font-weight:800;font-size:16px}
.sh-row{color:var(--mut);font-size:12px;margin-top:2px}
.sh-d{margin-top:10px;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font:600 11px Heebo;border-radius:999px;padding:2px 9px;border:1px solid}
.tag.il{color:var(--il);border-color:rgba(77,163,255,.5)}
.tag.own{color:var(--own);border-color:rgba(181,242,61,.5)}
.tag.spec{color:var(--spec);border-color:rgba(255,92,122,.5)}
.tag.etf{color:var(--txt);border-color:var(--line2)}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;text-align:center;text-decoration:none;font:700 13px Heebo;border-radius:10px;padding:10px;cursor:pointer;border:1px solid var(--neon);background:transparent;color:var(--neon)}
.btn.pri{background:var(--neon);color:#0a0d08}
@media (max-width:640px){
  h1{font-size:28px}
  .row{grid-template-columns:1fr;gap:6px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .t .tk{font-size:14px}
}

/* sheet v2 */
.sheet{max-height:86vh;overflow:auto}
.sh-top .tk{font-size:26px}
.sh-row{font-size:11.5px}
.vd{display:flex;align-items:center;gap:9px;margin-top:12px;border-radius:12px;padding:8px 12px;border:1px solid}
.vd b{font-size:15px;font-weight:900}
.vd span{font-size:12px;color:#cfd8d2;margin-inline-start:auto}
.vd.G{background:rgba(195,245,60,.09);border-color:rgba(195,245,60,.45)} .vd.G b{color:var(--neon)}
.vd.Y{background:rgba(255,176,32,.09);border-color:rgba(255,176,32,.45)} .vd.Y b{color:var(--hot)}
.vd.R{background:rgba(255,92,122,.09);border-color:rgba(255,92,122,.45)} .vd.R b{color:var(--spec)}
.lt{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.lt.G{background:var(--neon);box-shadow:0 0 8px rgba(195,245,60,.6)} .lt.Y{background:var(--hot)} .lt.R{background:var(--spec)}
.chart{margin-top:12px;height:280px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03);border:.5px solid var(--line2)}
.chart iframe{width:100%;height:100%;border:0;display:block}
.blk2{margin-top:14px}
.blk2 h4{font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:6px}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.sbar i{display:block;height:100%}
.slist{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px 14px}
.slist div{display:flex;align-items:center;gap:6px;font-size:12.5px}
.slist i{width:8px;height:8px;border-radius:3px;flex:none}
.slist b{font:600 12.5px Oswald;direction:ltr;color:var(--mut)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.met{background:rgba(255,255,255,.04);border:.5px solid var(--line2);border-radius:11px;padding:7px 10px;display:flex;align-items:center;gap:8px}
.met .v{font:700 18px Oswald;direction:ltr;line-height:1.2}
.met .v.tx{font:700 15px Heebo;direction:rtl}
.met .l{font-size:11px;color:var(--mut);line-height:1.25}
.met .lt{margin-inline-start:auto}
.warn{margin-top:6px;font-size:12px;color:var(--spec);display:flex;gap:6px;align-items:center}
.take{margin-top:12px;font-size:13.5px;color:#d6ded9;line-height:1.55;border-inline-start:3px solid var(--neon);padding-inline-start:9px}
.stt{margin-top:14px;align-items:center}
.addn{border:0;background:none;color:var(--mut);font:600 12px Heebo;cursor:pointer;margin-inline-start:auto;padding:4px 2px}
.addn.has{color:var(--neon)}
#note{display:none}
#note.on{display:block}
.acts .btn{padding:12px;font-size:14px}

/* sheet v3 */
.hd{display:flex;align-items:center;gap:10px}
.hd .tk{font:700 26px Oswald;color:var(--neon);direction:ltr;line-height:1}
.hd .nm{font-weight:800;font-size:16px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hd .x{margin-inline-start:auto;flex:none;background:none;border:1px solid var(--line2);color:var(--txt);border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:15px}
.hd .tag{flex:none}
.sheet .stt{margin-top:10px}
.met .v{text-align:right}
.wr{margin-top:8px;display:flex;gap:8px;align-items:flex-start;background:rgba(255,92,122,.08);border:1px solid rgba(255,92,122,.35);border-radius:11px;padding:7px 10px;font-size:12.5px;line-height:1.45}
.wr b{color:var(--spec);flex:none}
.flow{display:grid;grid-template-columns:52px 1fr;gap:6px 8px;align-items:center}
.flow .fl{font-size:11.5px;color:var(--mut)}
.flow .fb{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:rgba(255,255,255,.05)}
.flow .fb i{display:block;height:100%}
.fleg{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px 14px}
.fleg div{display:flex;align-items:center;gap:6px;font-size:12.5px}
.fleg i{width:8px;height:8px;border-radius:3px;flex:none}
.fleg b{font:600 12.5px Oswald;direction:ltr;color:var(--mut)}

/* sheet v4: compact, fits one screen */
.sheet{padding-top:14px}
.seg4{display:flex;gap:6px;margin-top:10px;align-items:stretch}
.seg4 .sg{flex:1;display:flex;background:rgba(118,118,128,.18);border-radius:10px;padding:2px}
.seg4 .sg button{flex:1;border:0;background:none;color:var(--mut);font:600 12px Heebo;padding:6px 2px;border-radius:8px;cursor:pointer}
.seg4 .sg button.on.s0{background:var(--s0);color:#14051f} .seg4 .sg button.on.s1{background:var(--s1);color:#1f1400}
.seg4 .sg button.on.s2{background:var(--s2);color:#04201b} .seg4 .sg button.on.s3{background:var(--s3);color:#fff}
.seg4 .nb{flex:none;width:36px;border-radius:10px;border:0;background:rgba(118,118,128,.18);color:var(--mut);font-size:15px;cursor:pointer}
.seg4 .nb.has{color:var(--neon)}
.sheet #note{margin-top:8px;min-height:56px}
.vd2{margin-top:10px;border-radius:12px;padding:8px 11px;border:1px solid}
.vd2 .r{display:flex;align-items:center;gap:8px}
.vd2 b{font-size:15px;font-weight:900}
.vd2 .r span{font-size:11.5px;color:var(--mut);margin-inline-start:auto}
.vd2 p{font-size:12.5px;color:#d6ded9;line-height:1.45;margin-top:4px}
.vd2.G{background:rgba(195,245,60,.08);border-color:rgba(195,245,60,.4)} .vd2.G b{color:var(--neon)}
.vd2.Y{background:rgba(255,176,32,.08);border-color:rgba(255,176,32,.4)} .vd2.Y b{color:var(--hot)}
.vd2.R{background:rgba(255,92,122,.08);border-color:rgba(255,92,122,.4)} .vd2.R b{color:var(--spec)}
.vd2 .w{margin-top:5px;font-size:12px;color:var(--spec)}
.sheet .chart{height:170px;margin-top:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.mini{background:rgba(255,255,255,.04);border:.5px solid var(--line2);border-radius:11px;padding:7px 9px}
.mini h5{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:5px}
.mini .sbar{height:6px;border-radius:3px;margin-bottom:5px}
.mini .ln{display:flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.55;white-space:nowrap}
.mini .ln i{width:7px;height:7px;border-radius:2px;flex:none}
.mini .ln span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini .ln b{margin-inline-start:auto;font:600 12px Oswald;direction:ltr;color:#cfd8d2;padding-inline-start:4px}
.mini .ln.tot{border-top:.5px solid var(--line2);margin-top:3px;padding-top:3px;font-weight:700}
.mini .ln.pos b{color:var(--neon)} .mini .ln.neg b,.mini .ln.neg{color:var(--spec)}
.m4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.m4>div{background:rgba(255,255,255,.04);border:.5px solid var(--line2);border-radius:10px;padding:6px 6px 5px;position:relative;text-align:center}
.m4 .v{font:700 15px Oswald;direction:ltr;line-height:1.2}
.m4 .v.tx{font:700 12.5px Heebo;direction:rtl;line-height:1.45}
.m4 .l{font-size:10px;color:var(--mut);line-height:1.2;margin-top:1px}
.m4 .lt{position:absolute;top:5px;left:5px;width:6px;height:6px}
.sheet .acts{margin-top:10px}
.sheet .acts .btn{padding:10px}

/* desktop: two columns so the whole card fits one screen */
@media (min-width:820px){
  .sheet{max-width:960px;border-radius:20px 20px 0 0;padding:18px 22px calc(var(--nav-h,0px) + 14px)}
  .lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);column-gap:18px;row-gap:8px;align-items:start;
    grid-template-areas:"hd chart" "seg chart" "note chart" "vd chart" "m4 duo" "acts duo";grid-template-rows:auto auto auto 1fr auto auto}
  .lay:not(.addf)>*{margin-top:0!important}
  .lay .hd{grid-area:hd} .lay .seg4{grid-area:seg} .lay #note{grid-area:note} .lay .vd2,.lay .sh-d{grid-area:vd}
  .lay .chart{grid-area:chart;height:auto;min-height:200px;align-self:stretch} .lay .duo{grid-area:duo} .lay .m4{grid-area:m4} .lay .acts{grid-area:acts}
}

/* v5 */
.vd2{padding:7px 11px}
.tk2{margin-top:9px}
.tk2 .take{margin-top:0;font-size:13px}
.wl{margin-top:6px;font-size:12px;color:var(--spec);padding-inline-start:12px}
.wl b{font-weight:700}
.duo{grid-template-columns:1fr 1fr}
.mini{min-width:150px}
.mini .ln b{padding-inline-start:14px}
@media (min-width:820px){
  .lay{grid-template-areas:"hd chart" "seg chart" "note chart" "vd chart" "tk2 chart" "m4 duo" "acts duo";grid-template-rows:auto auto auto auto 1fr auto auto}
  .lay .tk2{grid-area:tk2}
}

/* על הכוונת */
.sec.mine .sec-h h2{color:var(--neon);text-shadow:0 0 14px rgba(195,245,60,.35)}
.row.mrow{border-color:rgba(195,245,60,.45);background:linear-gradient(135deg,rgba(195,245,60,.10),rgba(61,220,192,.05)),var(--card);box-shadow:0 0 0 1px rgba(195,245,60,.12),0 0 24px rgba(195,245,60,.08)}
.t.add{border:1px dashed rgba(195,245,60,.6);background:rgba(195,245,60,.06)}
.t.add .tk{color:var(--neon);font-size:18px}
.t.add .nm{color:var(--neon)}
.addf input{width:100%;margin-top:10px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;color:var(--txt);font:16px Heebo;padding:9px 12px;outline:none}
.addf input:focus{border-color:var(--neon-dim)}
.addf #ntk{font-family:Oswald;letter-spacing:.04em;text-align:right}
.lay.addf{display:block;max-width:480px;margin:0 auto}
.btn.rmv{flex:0 0 auto;min-width:0;border-color:var(--line2);color:var(--mut);background:transparent}

/* labels: never cut, hot rows framed in gold */
@media(min-width:900px){.row{grid-template-columns:270px 1fr}}
.lbl h3{white-space:normal;flex-wrap:wrap;row-gap:2px;line-height:1.3}
.lbl h3 .badge{flex:none}
.lbl p{white-space:normal;overflow:visible;text-overflow:clip;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.t .nm{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.row.hot{border:1px solid rgba(255,176,32,.75);box-shadow:0 0 0 1px rgba(255,176,32,.18),0 0 22px rgba(255,176,32,.14);
}

/* strongest verdict */
.vd2.S{background:rgba(195,245,60,.14);border-color:var(--neon);box-shadow:0 0 18px rgba(195,245,60,.25)} .vd2.S b{color:var(--neon)}
.lt.S{background:var(--neon);box-shadow:0 0 10px rgba(195,245,60,.9)}
</style>

</head>
<body data-tab="sectors">
<div class="wrap">
<header>
  <h1>מפת <span>סקטורים</span></h1>
  <div class="sub" data-today></div>
  <button class="maplink" onclick="Roy.go('map')">מפת הקשרים</button>
</header>

<div class="bar">
  <div class="filters">
    <button class="f on" data-f="all">הכל</button>
    <button class="f" data-f="hot">תחומים חמים</button>
    <button class="f" data-f="il">ישראליות</button>
    <button class="f" data-f="own">בתיק</button>
    <button class="f" data-f="watch">במעקב</button>
    <input id="q" placeholder="חיפוש טיקר או חברה" autocomplete="off">
  </div>
  <div class="legend">
    <span><i class="d-own"></i>בתיק</span>
    <span><i class="d-il"></i>ישראלית</span>
    <span><i class="d-spec"></i>ספקולטיבית</span>
    <span><i class="d-s0"></i>לחקור</span>
    <span><i class="d-s1"></i>בבדיקה</span>
    <span><i class="d-s2"></i>מתאימה</span>
    <span><i class="d-s3"></i>נפסלה</span>
    <span class="sync">נשמר במכשיר</span>
  </div>
</div>

<main id="app"></main>

</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="js/core.js?v=12"></script>

try{ const o=JSON.parse(localStorage.getItem("themeWatch")||"null"); if(o) watch=new Map(o); }catch(e){}
function saveLocal(){ try{ localStorage.setItem("themeWatch",JSON.stringify([...watch])); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function today(){ const d=new Date(); return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear(); }
function isOwn(st){ return ownSet.has(st[0]); }

function match(st,row){
  const tags=st[3]||[];
  if(filter==="hot" && !row.hot) return false;
  if(filter==="il" && !tags.includes("il")) return false;
  if(filter==="own" && !isOwn(st)) return false;
  if(filter==="watch" && !watch.has(st[0])) return false;
  if(query){ const q=query.toLowerCase(); if(!(st[0].toLowerCase().includes(q)||st[1].toLowerCase().includes(q)||st[2].includes(query))) return false; }
  return true;
}

function tile(st){
  const tg=st[3]||[], own=isOwn(st), w=watch.get(st[0]), sc=w?SCLS[w.s]:"";
  const dots=(own?'<i class="d-own"></i>':"")+(tg.includes("il")?'<i class="d-il"></i>':"")+(tg.includes("spec")?'<i class="d-spec"></i>':"")+(w?`<i class="d-${sc}"></i>`:"");
  return `<button class="t${own?" own":""}${w?" w "+sc:""}" data-k="${st[0]}"><div class="dots">${dots}</div><div class="tk">${st[0]}</div><div class="nm">${esc(st[1])}</div></button>`;
}
function mineHtml(){
  const items=mine.filter(st=>match(st,MINE_ROW));
  if(filter!=="all" && !items.length) return "";
  if(query && !items.length) return "";
  return `<section class="sec mine"><div class="sec-h"><h2>על הכוונת</h2><span class="en">MY WATCHLIST</span></div>
    <div class="row mrow"><div class="lbl"><h3>מניות שהוספת</h3><p>כל מניה, גם אם היא לא במפה.</p></div>
    <div class="tiles">${items.map(tile).join("")}${filter==="all"&&!query?'<button class="t add" id="addst"><div class="tk">+</div><div class="nm">הוסף מניה</div></button>':""}</div></div></section>`;
}
function render(){
  const app=document.getElementById("app"); let html=mineHtml(), n=0, any=!!html;
  S.forEach(sec=>{
    let rows="";
    sec.rows.forEach(r=>{
      n++;
      const items=r.s.filter(st=>match(st,r));
      if(!items.length) return;
      any=true;
      rows+=`<div class="row${r.hot?" hot":""}">
        <div class="lbl">
          <h3><span class="num">${String(n).padStart(2,"0")}</span>${r.t}${r.hot?'<span class="badge hot">חם</span>':""}</h3>
          <p>${r.p}</p></div>
        <div class="tiles">${items.map(tile).join("")}</div></div>`;
    });
    if(rows) html+=`<section class="sec"><div class="sec-h"><h2>${sec.h}</h2><span class="en">${sec.en}</span></div>${rows}</section>`;
  });
  app.innerHTML=any?html:`<div class="empty">${filter==="watch"?"עוד אין מניות במעקב. לחץ על מניה ותן לה סטטוס.":"לא נמצאו מניות."}</div>`;
}

function find(k){ for(const st of mine) if(st[0]===k) return {st,r:MINE_ROW,sec:null,mine:1}; for(const sec of S) for(const r of sec.rows) for(const st of r.s) if(st[0]===k) return {st,r,sec}; }
const SEGC=["#C3F53C","#3DDCC0","#4DA3FF","#FFB020"];
const TV_EX={ESLT:"NASDAQ:ESLT",RHM:"XETR:RHM"};
function tvSym(k){ if(TV_EX[k]) return TV_EX[k]; if(/\.TA$/.test(k)) return "TASE:"+k.replace(/\.TA$/,""); if(YAHOO_TA[k]&&YAHOO_TA[k].endsWith(".TA")) return "TASE:"+k; return k; }
function chartSrc(k){
  const q=new URLSearchParams({symbol:tvSym(k),interval:"D",range:"12M",theme:"dark",style:"1",locale:"he_IL",timezone:"Asia/Jerusalem",
    hide_top_toolbar:"1",hide_side_toolbar:"1",hide_legend:"1",hide_volume:"1",withdateranges:"0",allow_symbol_change:"0",save_image:"0",
    backgroundColor:"rgba(30,38,34,1)",gridColor:"rgba(255,255,255,0.05)"});
  return "https://s.tradingview.com/widgetembed/?"+q.toString();
}
function money(v){ const a=Math.abs(v); return (v<0?"−":"")+(a>=1000?"$"+(a/1000).toFixed(1)+"B":"$"+Math.round(a)+"M"); }
function segHtml(c){
  let seg=c.seg.slice().sort((a,b)=>b[1]-a[1]);
  if(seg.length>4){ const rest=seg.slice(3).reduce((a,x)=>a+x[1],0); seg=seg.slice(0,3).concat([["אחר",rest]]); }
  const tot=seg.reduce((a,x)=>a+x[1],0);
  return `<div class="mini"><h5>מאיפה הכסף מגיע</h5>
    <div class="sbar">${seg.map((x,i)=>`<i style="width:${x[1]/tot*100}%;background:${SEGC[i]}"></i>`).join("")}</div>
    ${seg.map((x,i)=>`<div class="ln"><i style="background:${SEGC[i]}"></i><span>${x[0]}</span><b>${Math.round(x[1]/tot*100)}%</b></div>`).join("")}</div>`;
}
function flowHtml(c){
  const o=c.out; if(!o) return "";
  const rev=c.rev||c.seg.reduce((a,x)=>a+x[1],0), spend=rev-o.net, m=Math.round(o.net/rev*100);
  return `<div class="mini"><h5>הרבעון במספרים</h5>
    <div class="ln"><span>הכנסות</span><b>${money(rev)}</b></div>
    <div class="ln"><span>הוצאות</span><b>${money(spend)}</b></div>
    <div class="ln tot ${o.net<0?"neg":"pos"}"><span>${o.net<0?"הפסד":"רווח נקי"}</span><b>${money(o.net)}</b></div>
    <div class="ln" style="color:var(--mut)"><span>שולי רווח נקי</span><b style="color:var(--mut)">${m}%</b></div></div>`;
}
function openSheet(k,noteOpen){
  const f=find(k), {st}=f, tg=st[3]||[], w=watch.get(k), own=isOwn(st), c=CARDS[k];
  const tags=[own?'<span class="tag own">בתיק</span>':"",tg.includes("il")?'<span class="tag il">ישראלית</span>':"",tg.includes("spec")?'<span class="tag spec">ספקולטיבית</span>':""].join("");
  let card="";
  if(c){
    const V=cardVerdict(c);
    card=`<div class="vd2 ${V.cls}"><div class="r"><i class="lt ${V.cls}"></i><b>${V.label}</b><span>${V.greens} מתוך 4 בירוק · ${c.q}</span></div></div>
     <div class="tk2"><div class="take">${c.take}</div>${(c.warn||[]).map(x=>`<div class="wl">⚠ <b>${x[0]}:</b> ${x[1]}</div>`).join("")}</div>
     <div class="chart"><iframe src="${chartSrc(k)}" loading="lazy" title="גרף"></iframe></div>
     <div class="duo">${segHtml(c)}${flowHtml(c)}</div>
     <div class="m4">${CARD_TESTS.map((t,i)=>{ const val=t.v(c[t.k]), tx=/[א-ת]/.test(val);
       return `<div><i class="lt ${V.lights[i]}"></i><div class="v${tx?" tx":""}">${val}</div><div class="l">${t.l}</div></div>`; }).join("")}</div>`;
  } else {
    card=`${st[2]?`<div class="sh-d">${esc(st[2])}</div>`:`<div class="sh-d" style="color:var(--mut);font-size:12.5px">עוד אין ניתוח למניה הזו. בקש מ־Claude לנתח אותה.</div>`}<div class="chart"><iframe src="${chartSrc(k)}" loading="lazy" title="גרף"></iframe></div>`;
  }
  const hasNote=!!(w&&w.n&&w.n.trim());
  document.getElementById("sheet").innerHTML=`<div class="lay">
    <div class="hd"><span class="tk">${k}</span><span class="nm">${st[1]}</span>${tags}<button class="x" id="x">✕</button></div>
    <div class="seg4"><div class="sg">${STATUS.map(s=>`<button class="sb ${SCLS[s]}${w&&w.s===s?" on":""}" data-s="${s}">${s}</button>`).join("")}</div><button class="nb${hasNote?" has":""}" id="addn" title="הערה">✎</button></div>
    <textarea id="note" class="${noteOpen||hasNote?"on":""}" placeholder="למה היא מעניינת אותך? מה צריך לבדוק">${esc(w?w.n:"")}</textarea>
    ${card}
    <div class="acts"><button class="btn pri" id="tolab">למעבדה</button>${f.mine?'<button class="btn rmv" id="rmv">הסר מהכוונת</button>':""}</div></div>`;
  const sh=document.getElementById("sheet"); sh.scrollTop=0;
  document.getElementById("ov").classList.add("on");
  document.getElementById("x").onclick=closeSheet;
  if(f.mine) document.getElementById("rmv").onclick=()=>{ mine=mine.filter(x=>x[0]!==k); saveMine(); closeSheet(); render(); };
  document.getElementById("tolab").onclick=()=>{ closeSheet(); Roy.go("lab",(own?"#h-":"#t-")+k); };
  document.getElementById("addn").onclick=()=>{ const n=document.getElementById("note"); n.classList.toggle("on"); if(n.classList.contains("on")) n.focus(); };
  document.querySelectorAll(".sb").forEach(b=>b.onclick=()=>{
    const s=b.dataset.s, cur=watch.get(k);
    if(cur&&cur.s===s){ if(cur.n&&cur.n.trim()) return; watch.delete(k); } else watch.set(k,{s,n:cur?cur.n:"",u:today()});
    const y=sh.scrollTop; saveLocal(); render(); openSheet(k); sh.scrollTop=y; });
  document.getElementById("note").addEventListener("input",e=>{
    const v=e.target.value, cur=watch.get(k);
    if(!cur && !v.trim()) return;
    watch.set(k,{s:cur?cur.s:"לחקור",n:v,u:today()});
    saveLocal(); render(); });
}
function closeSheet(){ document.getElementById("ov").classList.remove("on"); }
document.getElementById("ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeSheet(); });
function openAdd(){
  document.getElementById("sheet").innerHTML=`<div class="lay addf">
    <div class="hd"><span class="nm" style="font-size:18px">הוסף מניה לכוונת</span><button class="x" id="x">✕</button></div>
    <input id="ntk" placeholder="סימול, למשל PLTR או POLI.TA" autocomplete="off" autocapitalize="characters" dir="ltr">
    <input id="nnm" placeholder="שם החברה (לא חובה)" autocomplete="off">
    <div class="acts"><button class="btn pri" id="nadd">הוסף</button></div>
    <div class="sh-row" id="nmsg"></div></div>`;
  document.getElementById("ov").classList.add("on");
  document.getElementById("x").onclick=closeSheet;
  const tk=document.getElementById("ntk"); setTimeout(()=>tk.focus(),50);
  const go=()=>{
    const k=tk.value.trim().toUpperCase().replace(/[^A-Z0-9.-]/g,""), nm=document.getElementById("nnm").value.trim();
    if(!k){ document.getElementById("nmsg").textContent="צריך סימול."; return; }
    if(find(k)){ openSheet(k); return; }
    mine.unshift([k,nm||k,""]); saveMine(); render(); openSheet(k);
  };
  document.getElementById("nadd").onclick=go;
  tk.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  document.getElementById("nnm").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}
document.getElementById("app").addEventListener("click",e=>{ if(e.target.closest("#addst")){ openAdd(); return; } const b=e.target.closest(".t"); if(b) openSheet(b.dataset.k); });
document.querySelectorAll(".f").forEach(b=>b.onclick=()=>{ document.querySelectorAll(".f").forEach(x=>x.classList.remove("on")); b.classList.add("on"); filter=b.dataset.f; render(); });
document.getElementById("q").addEventListener("input",e=>{ query=e.target.value.trim(); render(); });
render();
{ const m=(location.hash||"").match(/^#k-([A-Za-z0-9.-]+)$/); if(m&&find(m[1].toUpperCase())) openSheet(m[1].toUpperCase()); }
Roy.data().then(d=>{
  ownSet=new Set(((d.datasets&&d.datasets.holdings)||[]).map(h=>String(h.ticker).toUpperCase()));
  render();
},()=>{});
</script>
</body>
</html>
