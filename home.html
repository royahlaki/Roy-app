<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דף הבית</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--card:#FFFFFF;--line:#DCE8FB;--soft:#EEF4FD;--fg:#0F1E3D;--mut:#6A7FA3;--blu:#2563EB;--blu-bg:#EAF2FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;color:var(--fg);font-family:Heebo,system-ui,sans-serif;padding-bottom:var(--nav-h,0px);min-height:100vh;
  background:linear-gradient(180deg,#F2F7FF 0%,#EAF3FF 45%,#F3EEFF 100%);background-attachment:fixed}
.hero{background:linear-gradient(155deg,#1E3A8A 0%,#2563EB 55%,#22D3EE 130%);color:#fff;text-align:center;
  padding:calc(var(--top-h,0px) + 22px) 20px 54px;border-radius:0 0 28px 28px}
.hero h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.2px}
.hero .dt{font-size:13px;color:rgba(255,255,255,.78);margin-top:4px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 28px}
h2{font-size:13px;font-weight:600;color:var(--mut);margin:24px 4px 10px}
/* lists card */
.lists{max-width:400px;margin:-34px auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px 8px;position:relative;box-shadow:0 10px 28px rgba(30,58,138,.12)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--mut);padding:6px 0;border-radius:999px;cursor:pointer}
.seg button.on{background:#fff;color:var(--blu);box-shadow:0 1px 4px rgba(30,58,138,.12)}
.seg b{font-weight:600;font-size:11px;background:var(--blu-bg);color:var(--blu);border-radius:999px;padding:0 6px;margin-inline-start:4px}
.add{display:flex;gap:6px;margin-bottom:2px}
.add input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;color:var(--fg)}
.add button{font:inherit;font-size:20px;line-height:1;font-weight:500;border:0;border-radius:10px;width:36px;background:var(--blu);color:#fff;cursor:pointer}
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{display:flex;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid var(--soft)}
ul.tl li:first-child{border-top:0}
ul.tl input[type=checkbox]{width:18px;height:18px;margin:0;flex:none;accent-color:var(--blu);cursor:pointer}
ul.tl .tx{flex:1;font-size:14px;line-height:1.35;word-break:break-word}
ul.tl li.done .tx{color:var(--mut);text-decoration:line-through}
ul.tl .del{border:0;background:none;color:#A9B8D3;font-size:17px;line-height:1;cursor:pointer;padding:0 2px}
.foot{display:flex;justify-content:center}
.tg{font:inherit;font-size:12px;color:var(--mut);background:none;border:0;padding:4px 2px;cursor:pointer}
.msg{font-size:13px;color:var(--mut);padding:8px 2px;text-align:center}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
a.t{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
a.t:active{transform:scale(.98)}
a.t:hover{border-color:var(--blu)}
.t .ic{font-size:19px;line-height:1}
.t .n{font-size:14px;font-weight:600}
.feat a.t{background:var(--blu-bg);border-color:#C9DCFB}
/* drive strip */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 4px 6px;margin:0 -16px;padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--fg);text-decoration:none;white-space:nowrap}
.strip a::before{content:"📁";font-size:14px}
.hh{display:flex;align-items:baseline;justify-content:space-between;margin:24px 4px 10px}
.hh h2{margin:0}
.hh .sys{font-size:13px;font-weight:600;color:var(--blu);text-decoration:none}
.habits{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hb{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.hb.on{background:var(--blu);border-color:var(--blu);color:#fff}
.hb.on::after{content:"✓";font-weight:700}
.strip.ru a::before{content:none}
.strip.ru a span{font-size:15px}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}

/* ===== Apple polish (layer on top; structure unchanged) ===== */
:root{--line:rgba(60,60,67,.10);--sep:rgba(60,60,67,.12);--fill:rgba(118,118,128,.10);--sh:0 1px 2px rgba(15,30,61,.04),0 6px 20px rgba(15,30,61,.06);--ease:cubic-bezier(.2,.8,.2,1)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew",Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  background:linear-gradient(180deg,#F4F8FF 0%,#F2F5FC 50%,#F5F3FC 100%)}
.hero{background:linear-gradient(170deg,#2D5BD8 0%,#3B7BF0 55%,#5AA2F7 100%);padding-bottom:58px;border-radius:0 0 32px 32px}
.hero h1{font-weight:700;letter-spacing:-.025em}
.hero .dt{font-size:14px;color:rgba(255,255,255,.82);margin-top:6px;letter-spacing:0}
h2,.hh h2{font-size:15px;font-weight:600;color:#3C4A66;letter-spacing:-.01em}
.hh .sys{font-weight:500}
/* lists card */
.lists{border:0;border-radius:22px;padding:12px 14px 10px;box-shadow:0 2px 6px rgba(30,58,138,.05),0 14px 36px rgba(30,58,138,.12)}
.seg{background:var(--fill);border-radius:10px;padding:2px;margin-bottom:10px}
.seg button{border-radius:8px;padding:7px 0;transition:color .25s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease)}
.seg button.on{box-shadow:0 1px 3px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.06)}
.add{gap:8px;margin-bottom:4px}
.add input{border:0;background:var(--fill);border-radius:10px;padding:8px 12px;outline:none;transition:box-shadow .2s}
.add input:focus{box-shadow:0 0 0 3px rgba(37,99,235,.22)}
.add input::placeholder{color:#94A3B8}
.add button{border-radius:10px;transition:transform .15s var(--ease),opacity .15s}
.add button:active{transform:scale(.92);opacity:.85}
ul.tl li{gap:12px;padding:10px 2px;border-top:.5px solid var(--sep)}
ul.tl input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:22px;border:1.5px solid #C3CBD9;border-radius:50%;position:relative;background:transparent;transition:background .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease)}
ul.tl input[type=checkbox]:active{transform:scale(.88)}
ul.tl input[type=checkbox]:checked{background:var(--blu);border-color:var(--blu)}
ul.tl input[type=checkbox]:checked::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:rotate(45deg) scale(.4)}to{opacity:1;transform:rotate(45deg) scale(1)}}
ul.tl .tx{font-size:15px}
ul.tl li.done .tx{text-decoration:none;color:#94A3B8}
ul.tl .del{color:#C3CBD9;transition:color .2s}
ul.tl .del:active{color:#FF3B30}
.tg{color:var(--blu);font-weight:500}
/* habits + strips */
.hb,.strip a{border:0;box-shadow:var(--sh);transition:transform .15s var(--ease),background .25s var(--ease),color .25s var(--ease),box-shadow .25s var(--ease)}
.hb:active,.strip a:active{transform:scale(.95)}
.hb.on{box-shadow:0 4px 14px rgba(37,99,235,.28)}
.strip{padding-top:4px;padding-bottom:12px}

/* ===== Dark mode (follows the iPhone) ===== */
@media(prefers-color-scheme:dark){
  :root{--card:#1C1C1E;--fg:#F5F5F7;--mut:#98989D;--soft:#2C2C2E;--blu:#0A84FF;--blu-bg:rgba(10,132,255,.18);--sep:rgba(84,84,88,.45);--fill:rgba(118,118,128,.24);--sh:none}
  body{background:#000}
  .hero{background:linear-gradient(170deg,#16295E 0%,#1E3F96 60%,#2A5BC4 100%)}
  h2,.hh h2{color:#C7C7CC}
  .lists{box-shadow:none}
  .seg button.on{background:#636366;color:#fff;box-shadow:none}
  .seg button.on b{background:rgba(255,255,255,.22);color:#fff}
  .add input{color:var(--fg)}
  .add input::placeholder{color:#636366}
  ul.tl input[type=checkbox]{border-color:#545458}
  ul.tl li.done .tx{color:#636366}
  ul.tl .del{color:#545458}
  .hb.on{box-shadow:none}
}
</style>
</head>
<body data-tab="home">
<header class="hero">
  <h1 data-greet>שלום רוי</h1>
  <div class="dt" data-today></div>
</header>
<div class="wrap">
  <section class="lists">
    <div class="seg" role="tablist">
      <button type="button" data-l="tasks" class="on">משימות<b id="c-tasks" hidden></b></button>
      <button type="button" data-l="shop">לקנות<b id="c-shop" hidden></b></button>
    </div>
    <form class="add" id="add"><input id="newt" placeholder="משימה חדשה" autocomplete="off" enterkeyhint="done"><button type="submit" aria-label="הוסף">+</button></form>
    <ul class="tl" id="open"></ul>
    <div class="msg" id="msg">טוען...</div>
    <div class="foot"><button class="tg" id="tg" hidden></button></div>
    <ul class="tl" id="closed" hidden></ul>
  </section>
  <div class="hh"><h2>היום</h2><a class="sys" href="https://docs.google.com/document/d/114oNvKnNHfBQTZwwgLMcO-XR9J41g7PAHYYeFPj5fN0/edit">המערכת שלי ‹</a></div>
  <div class="habits" id="habits"></div>
  <h2>ReadUp</h2>
  <div class="strip ru">
    <a href="https://docs.google.com/document/d/1ENPRI8dql8X7vPu65kqR5UhF4Dbbo3kFHUxQIOFDys4/edit"><span>🗓️</span>תוכנית פרסום</a>
    <a href="https://docs.google.com/document/d/1sSDmnB6Mv4_-geKEnmmQV7WMDuDV4vuwIJf-M_eAeo8/edit"><span>💡</span>בנק רעיונות</a>
    <a href="https://docs.google.com/document/d/1Fzql9CLijZWUorQ_WayAHCCBUJSxB2oFvj3lGnR_mnc/edit"><span>🎯</span>אסטרטגיית תוכן</a>
    <a href="https://docs.google.com/spreadsheets/d/1Mwvm65tJt4bWzLlWozP9hh6V1_2tiWkI7oegoHCsoXo/edit"><span>📊</span>001</a>
    <a href="https://www.instagram.com/readup.il/"><span>📷</span>readup.il</a>
  </div>
  <h2>Drive</h2>
  <div class="strip">
    <a class="t" href="https://drive.google.com/drive/folders/15-PyVghKjT-7YtKtQvz8ar-_ozIFmz_h">01 אישי</a>
    <a class="t" href="https://drive.google.com/drive/folders/1gJ3Mo-M0gMtMUmwqBVJgadJH8uk0Fj_g">02 כספים</a>
    <a class="t" href="https://drive.google.com/drive/folders/1LfxdysrF6AuntbBv6hXCbH_fxMASt7wp">03 השקעות</a>
    <a class="t" href="https://drive.google.com/drive/folders/12uZK3gndZiBA9zPnk-o8kM9NPymwYv9I">04 ReadUp</a>
    <a class="t" href="https://drive.google.com/drive/folders/1i7So_V29yMiJzexRyHGw6HDkXO6F05wu">05 לימודים</a>
    <a class="t" href="https://drive.google.com/drive/folders/19LUIMwbuIBbdBRhIHwGvC47nqom4di_1">06 שיווק</a>
    <a class="t" href="https://drive.google.com/drive/folders/16RkMin2mCPJ3xnP5W9EWGUcYknGN4M4Y">99 ארכיון</a>
  </div>
</div>
<script src="js/core.js?v=3"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var open = $('open'), closed = $('closed'), msg = $('msg'), tg = $('tg'), inp = $('newt');
  var L = {
    tasks: { key: 'roy-tasks', ph: 'משימה חדשה', empty: 'אין משימות פתוחות.', rows: [] },
    shop: { key: 'roy-shop', ph: 'מה לקנות?', empty: 'הרשימה ריקה.', rows: [] }
  };
  var cur = 'tasks', showDone = false;
  try { cur = localStorage.getItem('roy-list') === 'shop' ? 'shop' : 'tasks'; } catch (e) {}
  var save = function (l) { try { localStorage.setItem(l.key, JSON.stringify(l.rows)); } catch (e) {} };
  var item = function (l, t) {
    var li = document.createElement('li'); if (t.done) li.className = 'done';
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!t.done;
    cb.addEventListener('change', function () { t.done = cb.checked; t.doneAt = cb.checked ? new Date().toISOString() : null; save(l); render(); });
    var tx = document.createElement('span'); tx.className = 'tx'; tx.textContent = t.text || '';
    var del = document.createElement('button'); del.className = 'del'; del.type = 'button'; del.textContent = '×'; del.title = 'מחק';
    del.addEventListener('click', function () { l.rows = l.rows.filter(function (r) { return r !== t; }); save(l); render(); });
    li.append(cb, tx, del); return li;
  };
  var counts = function () {
    ['tasks', 'shop'].forEach(function (k) {
      var n = L[k].rows.filter(function (r) { return !r.done; }).length, b = $('c-' + k);
      b.hidden = !n; b.textContent = n;
    });
  };
  var render = function () {
    var l = L[cur];
    document.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.l === cur); });
    inp.placeholder = l.ph;
    var o = l.rows.filter(function (r) { return !r.done; }).sort(function (a, b) { return (a.created || '') < (b.created || '') ? -1 : 1; });
    var c = l.rows.filter(function (r) { return r.done; }).sort(function (a, b) { return (a.doneAt || '') < (b.doneAt || '') ? 1 : -1; });
    open.replaceChildren.apply(open, o.map(function (t) { return item(l, t); }));
    closed.replaceChildren.apply(closed, c.map(function (t) { return item(l, t); }));
    msg.hidden = o.length > 0; msg.textContent = l.empty;
    tg.hidden = !c.length; tg.textContent = showDone ? 'הסתר שבוצעו' : 'בוצעו (' + c.length + ')';
    closed.hidden = !showDone || !c.length;
    counts();
  };
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { cur = b.dataset.l; showDone = false; try { localStorage.setItem('roy-list', cur); } catch (e) {} render(); });
  });
  tg.addEventListener('click', function () { showDone = !showDone; render(); });
  $('add').addEventListener('submit', function (e) {
    e.preventDefault(); var v = inp.value.trim(); if (!v) return;
    inp.value = ''; var l = L[cur];
    l.rows.push({ id: 't' + Date.now(), text: v, done: false, created: new Date().toISOString(), by: 'רוי' }); save(l); render();
  });
  var load = function (k) { try { return JSON.parse(localStorage.getItem(L[k].key) || 'null'); } catch (e) { return null; } };
  var shop = load('shop'); L.shop.rows = Array.isArray(shop) ? shop : [];
  // One-time additions from Claude: each id is added once per device, even if later deleted.
  var ADD = [
    { id: 's20261112a', text: 'דיסק און קי (64GB+, USB 3.0, USB-C)' },
    { id: 's20261112b', text: 'מתאם USB-C לכבל רשת (Gigabit)' },
    { id: 's20261112c', text: 'כבל רשת Cat6' }
  ];
  var seen = [];
  try { seen = JSON.parse(localStorage.getItem('roy-shop-seen') || '[]') || []; } catch (e) {}
  var added = false;
  ADD.forEach(function (a) {
    if (seen.indexOf(a.id) > -1) return;
    seen.push(a.id);
    if (!L.shop.rows.some(function (r) { return r.id === a.id; })) {
      L.shop.rows.push({ id: a.id, text: a.text, done: false, created: new Date().toISOString(), by: 'Claude' });
      added = true;
    }
  });
  try { localStorage.setItem('roy-shop-seen', JSON.stringify(seen)); } catch (e) {}
  if (added) save(L.shop);
  Roy.data().then(function (data) {
    var t = load('tasks');
    L.tasks.rows = Array.isArray(t) ? t : (data.tasks || []).map(function (x) { return Object.assign({}, x); });
    render();
  }, function () { msg.textContent = 'הרשימות לא נטענו. נסה לרענן.'; });
})();

(function () {
  var box = document.getElementById('habits'); if (!box) return;
  var d = new Date(), day = d.getDay();
  var key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  var list = [['💧', 'מים'], ['🧘', 'מדיטציה'], ['📖', 'קריאה'], ['✍️', 'כתיבה'], ['🔤', 'אנגלית']];
  if (day === 1 || day === 3 || day === 6) list.push(['🏋️', 'אימון']);
  var store = {};
  try { store = JSON.parse(localStorage.getItem('roy-habits') || '{}') || {}; } catch (e) {}
  var done = store[key] || [];
  list.forEach(function (h) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'hb' + (done.indexOf(h[1]) > -1 ? ' on' : '');
    b.textContent = h[0] + ' ' + h[1];
    b.addEventListener('click', function () {
      var i = done.indexOf(h[1]); if (i > -1) done.splice(i, 1); else done.push(h[1]);
      b.classList.toggle('on', i < 0);
      var keep = {}; keep[key] = done;
      try { localStorage.setItem('roy-habits', JSON.stringify(keep)); } catch (e) {}
    });
    box.appendChild(b);
  });
})();
</script>
</body>
</html>
