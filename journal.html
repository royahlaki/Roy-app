<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יומן הוצאות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--fg:#0B3B2E;--muted:#5E8A7C;--line:#D3EEE4;--red:#E8435F;--green:#10A37F;--panel:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Heebo,system-ui,sans-serif;color:var(--fg);min-height:100vh;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#EFFBF6 0%,#ECF9F5 50%,#EAF6FB 100%);background-attachment:fixed}
#boot{color:var(--muted);text-align:center;padding:calc(var(--top-h,0px) + 60px) 20px}
.j{max-width:640px;margin:0 auto;padding:0 14px calc(var(--nav-h,0px) + 24px);display:flex;flex-direction:column;gap:12px}
.head{margin:0 -14px 4px;text-align:center;padding:calc(var(--top-h,0px) + 22px) 16px 22px;position:relative;
  background:linear-gradient(170deg,#06705A 0%,#0F9F7A 60%,#3CC9A3 100%);border-radius:0 0 32px 32px;color:#fff}
.head h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.025em}
.head .dt{font-size:13px;color:rgba(255,255,255,.8);margin-top:4px}
.back{position:absolute;right:14px;top:calc(var(--top-h,0px) + 24px);background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.seg button{flex:0 0 auto;border:0;background:rgba(118,118,128,.12);color:var(--muted);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;font-weight:500}
.seg button.on{background:#fff;color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.06)}
.card{background:var(--panel);border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(11,59,46,.04),0 8px 26px rgba(5,150,105,.09)}
.label{font-size:12px;color:var(--muted)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.mon{display:block}
.mon > summary{list-style:none;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:18px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(11,59,46,.04),0 6px 18px rgba(5,150,105,.08)}
.mon > summary::-webkit-details-marker{display:none}
.mon > summary span::after{content:' ▾';color:var(--muted);font-size:12px;font-weight:500}
.mon[open] > summary span::after{content:' ▴'}
.mon[open] > summary{background:#E6F6EF}
.mon-body{display:flex;flex-direction:column;gap:12px;margin:12px 0 6px}
#months{display:flex;flex-direction:column;gap:10px}
.split{display:flex;gap:8px;margin-top:10px}
.split div{flex:1;background:#F4FBF8;border-radius:12px;padding:6px 10px}
.split b{display:block;font-size:16px;font-weight:700}
.split .warn{background:#FFF5F6;box-shadow:inset 0 0 0 1.5px var(--red)}
.split .warn b{color:var(--red)}
.split .warn.ok{background:#F4FBF8;box-shadow:inset 0 0 0 1.5px var(--green)}
.split .warn.ok b{color:var(--green)}
.red{color:var(--red)}.green{color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:500;color:var(--muted);text-align:left;padding:0 0 4px}
th:first-child,td:first-child{text-align:right}
th:last-child,td:last-child{padding-inline-start:14px;width:4.5rem}
td{padding:7px 0;border-top:.5px solid var(--line);text-align:left}
tr.c{cursor:pointer}
tr.c.on td{background:#F0FAF6}
tr.tot td{font-weight:700;border-top:1.5px solid var(--fg)}
.unx{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:0 12px}
.unx summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px;font-weight:600;cursor:pointer}
.unx summary::-webkit-details-marker{display:none}
.unx summary span::after{content:' ▾';color:var(--muted);font-size:12px}
.unx[open] summary span::after{content:' ▴'}
.unx table{margin-bottom:6px}
.final{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:2px solid var(--fg);font-size:15px;font-weight:700}
.final b{font-size:18px}
.row{display:grid;grid-template-columns:3rem 1fr auto;gap:8px;align-items:center;padding:10px 6px;border-top:.5px solid var(--line);font-size:15px;font-weight:500}
.row:first-child{border-top:0}
.row > div:last-child{font-weight:700}
.row.inst{background:#EEF8F3;border-top-color:#fff;border-radius:10px}
.row.inst .n{font-weight:600}
.row .d{font-size:12px;color:var(--muted)}
.row .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:10px;font-weight:600;border-radius:99px;padding:1px 7px;margin-inline-start:6px;vertical-align:2px}
.pill.gold{background:rgba(192,138,0,.14);color:#8A6400}
.pill.n{background:rgba(5,150,105,.12);color:#047857}
.plus{color:var(--green)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.clear{border:0;background:rgba(118,118,128,.12);color:var(--fg);border-radius:99px;padding:3px 10px;font:inherit;font-size:12px}
.more{display:block;width:100%;margin-top:8px;border:0;background:none;color:var(--green);font:inherit;font-size:14px;font-weight:600;padding:6px}
.empty{text-align:center;color:var(--muted);padding:20px 8px;line-height:1.7}
</style>
<link rel="stylesheet" href="apple.css?v=1">
</head>
<body data-tab="journal">
<div id="boot">טוען…</div>
<div class="j" id="root" hidden>
  <header class="head">
    <button class="back" type="button" onclick="Roy.go('finance')">כספים</button>
    <h1>יומן הוצאות</h1>
    <div class="dt" id="sub"></div>
  </header>
  <div id="months"></div>
  <template id="tpl">
    <section class="card">
      <div class="label">יצא בחודש</div>
      <div class="big" data-k="total">—</div>
      <div class="split">
        <div><span class="label">קבוע</span><b data-k="fixed">—</b></div>
        <div class="warn" data-k="vs-box"><span class="label">הפרש</span><b data-k="vs">—</b></div>
        <div><span class="label">לא צפוי</span><b data-k="once">—</b></div>
      </div>
    </section>
    <section class="card">
      <table><thead><tr><th>קטגוריה</th><th>קבוע</th><th>יצא</th><th>הפרש</th></tr></thead><tbody data-k="cats"></tbody></table>
      <details class="unx" data-k="unx"><summary><span>הוצאות לא צפויות</span><b data-k="unx-sum"></b></summary>
        <table><tbody data-k="ocats"></tbody></table>
      </details>
      <div class="final"><span>סך הכול יצא</span><b data-k="final"></b></div>
    </section>
    <section class="card">
      <div class="top"><div class="label" data-k="list-title">הוצאות אחרונות</div><button class="clear" data-k="clear" type="button" hidden>הכול</button></div>
      <div data-k="list"></div>
      <button class="more" data-k="more" type="button" hidden>עוד</button>
    </section>
  </template>
</div>
<script src="js/core.js?v=8"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  var ils = function (v) { return '₪' + nf.format(Math.abs(Math.round(v))); };
  var sgn = function (v) { return Math.round(v) > 0 ? '⁦+' + ils(v) + '⁩' : Math.round(v) < 0 ? '⁦-' + ils(v) + '⁩' : '₪0'; };
  var dm = function (iso) { var p = String(iso).split('-'); return p[2] + '.' + p[1]; };
  var el = function (tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  var J = null, month = null, cat = null, all = false;

  function rowEl(r) {
    var row = el('div', 'row' + (r.i ? ' inst' : '')), n = el('div', 'n', r.n);
    if (r.x) n.append(el('span', 'pill n', r.x));
    if (r.o) n.append(el('span', 'pill gold', 'חד פעמי'));
    var a = Number(r.a);
    row.append(el('div', 'd', dm(r.d)), n, el('div', a > 0 ? 'plus' : '', a > 0 ? '+' + ils(a) : ils(a)));
    return row;
  }

  function render(meta, rows, root) {
    var q = function (k) { return root.querySelector('[data-k="' + k + '"]'); };
    var cat = null, all = false;
    var byDate = function (a, b) { return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; };
    var spent = function (rs) { return -rs.reduce(function (s, r) { return s + Number(r.a); }, 0); };
    function draw() {
      var fixedRows = rows.filter(function (r) { return !r.o; });
      var total = spent(rows), fixed = spent(fixedRows), once = total - fixed;
      var budget = Object.keys(meta.budget).reduce(function (s, k) { return s + Number(meta.budget[k]); }, 0);
      var vs = fixed - budget;
      q('total').textContent = ils(total);
      q('fixed').textContent = ils(fixed);
      q('vs').textContent = ils(vs); q('vs-box').className = 'warn' + (vs > 0 ? '' : ' ok');
      q('once').textContent = ils(once);
      var by = {}, ob = {};
      fixedRows.forEach(function (r) { by[r.c] = (by[r.c] || 0) - Number(r.a); });
      rows.filter(function (r) { return r.o; }).forEach(function (r) { ob[r.c] = (ob[r.c] || 0) - Number(r.a); });
      Object.keys(meta.budget).forEach(function (k) { if (!(k in by)) by[k] = 0; });
      var line = function (tb, k, act, b, key) {
        var d = b == null ? null : act - b, tr = el('tr', 'c' + (cat === key ? ' on' : ''));
        tr.append(el('td', '', k), el('td', '', b ? ils(b) : b === null ? '' : '—'), el('td', '', ils(act)));
        tr.append(el('td', d == null ? '' : d > 0.5 ? 'red' : d < -0.5 ? 'green' : '', d == null ? '' : Math.abs(d) < 0.5 ? '—' : sgn(d)));
        tr.onclick = function () { cat = cat === key ? null : key; all = false; draw(); };
        tb.append(tr);
      };
      var tb = q('cats'); tb.replaceChildren();
      Object.keys(by).sort(function (a, b) { return by[b] - by[a]; }).forEach(function (k) { line(tb, k, by[k], Number(meta.budget[k] || 0), k); });
      var tt = el('tr', 'tot'); tt.append(el('td', ''), el('td', '', ils(budget)), el('td', '', ils(fixed)), el('td', '')); tb.append(tt);
      var ot = q('ocats'); ot.replaceChildren();
      Object.keys(ob).sort(function (a, b) { return ob[b] - ob[a]; }).forEach(function (k) { line(ot, k, ob[k], null, '1:' + k); });
      q('unx').hidden = !once; q('unx-sum').textContent = ils(once);
      q('final').textContent = ils(total);
      var pick = function (r) { if (!cat) return true; var one = cat.indexOf('1:') === 0; return one ? (r.o && r.c === cat.slice(2)) : (!r.o && r.c === cat); };
      var inst = rows.filter(function (r) { return r.i && pick(r); }).sort(function (a, b) { return Number(a.a) - Number(b.a); });
      var rest = rows.filter(function (r) { return !r.i && pick(r); }).sort(byDate);
      var list = inst.concat(rest), lim = all ? list.length : inst.length + 12;
      q('list-title').textContent = cat ? (cat.indexOf('1:') === 0 ? cat.slice(2) : cat) : 'הוצאות אחרונות';
      q('clear').hidden = !cat;
      var box = q('list'); box.replaceChildren();
      if (!list.length) box.append(el('div', 'empty', 'אין חיובים'));
      list.slice(0, lim).forEach(function (r) { box.append(rowEl(r)); });
      q('more').hidden = list.length <= lim && !all; q('more').textContent = all ? 'פחות' : 'עוד ' + (list.length - lim);
    }
    q('more').onclick = function () { all = !all; draw(); };
    q('clear').onclick = function () { cat = null; draw(); };
    draw();
  }

  Roy.data().then(function (d) {
    var J = (d.finance && d.finance.journal) || { months: [], rows: [] };
    if (J.months.length && J.months[0].r) {
      var rs = [];
      J.months = J.months.map(function (mm) {
        mm.r.forEach(function (x) {
          var f = x[5] || '';
          rs.push({ d: x[0].length === 5 ? mm.m.slice(0, 4) + '-' + x[0] : x[0], n: x[1], a: x[2], p: x[3], c: x[4], m: mm.m, i: f.indexOf('i') > -1, o: f.indexOf('o') > -1, x: x[6] });
        });
        return { month: mm.m, label: mm.l, budget: mm.b || J.budget, oneoff_budget: J.oneoff_budget };
      });
      J.rows = rs;
    }
    $('boot').hidden = true; $('root').hidden = false;
    var box = $('months');
    if (!J.months.length) { box.append(el('div', 'empty', 'היומן עוד ריק')); return; }
    $('sub').textContent = J.months.length + ' חודשים';
    J.months.slice().sort(function (a, b) { return a.month < b.month ? 1 : -1; }).forEach(function (m, i) {
      var rows = J.rows.filter(function (r) { return r.m === m.month; });
      var det = el('details', 'mon'), sum = el('summary');
      sum.append(el('span', '', m.label), el('b', '', ils(-rows.reduce(function (s, r) { return s + Number(r.a); }, 0))));
      det.append(sum);
      var body = el('div', 'mon-body'); body.append($('tpl').content.cloneNode(true)); det.append(body);
      render(m, rows, body);
      if (i === 0) det.open = true;
      box.append(det);
    });
  });
})();
</script>
</body>
</html>
